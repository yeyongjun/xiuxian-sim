<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>修仙模拟器</title>
<!-- 手机「添加到主屏幕」后全屏启动，不带浏览器地址栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="修仙">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0b0a">
<style>
:root {
  --ink: #0d0b0a;
  --ink-2: #17130f;
  --gold: #c9a227;
  --gold-dim: #8a7020;
  --paper: #d9cdb4;
  --text: #cfc4ad;
  --danger: #a8322a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--text);
  font-family: "Songti SC", "STSong", serif;
  /* 宣纸横纹压在墨色晕开的底子上。两层顺序不能颠倒——
     径向渐变两端都不透明，放在上层会把纹理整个盖掉。 */
  background-color: var(--ink);
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 0%, #1b1611 0%, var(--ink) 60%);
  background-attachment: fixed;
}
#app { max-width: 960px; margin: 0 auto; padding: 16px; }
#top-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
  border-bottom: 1px solid var(--gold-dim); padding-bottom: 8px;
}
#luck-text { color: var(--gold-dim); }
#body { display: grid; grid-template-columns: 200px 1fr 200px; gap: 16px; margin: 16px 0; }
.panel { border: 1px solid var(--gold-dim); padding: 10px; margin-bottom: 12px; background: var(--ink-2); }
/* 无状态时 #debuff-panel 的 innerHTML 为空，不隐藏会剩一个空框 */
.panel:empty { display: none; }
.panel-title { color: var(--gold); letter-spacing: 4px; margin-bottom: 6px; }
.panel-desc { font-size: 12px; opacity: 0.7; margin: 4px 0 8px; }
.tag { display: inline-block; border: 1px solid var(--gold-dim); padding: 2px 8px; margin: 2px 0; color: var(--gold); }
.tag.danger { border-color: var(--danger); color: var(--danger); }
.bar { height: 6px; background: #241d16; border: 1px solid var(--gold-dim); flex: 1; min-width: 120px; }
.fill { height: 100%; background: var(--gold); transition: width 120ms linear; }
#life-bar.urgent .fill { background: var(--danger); animation: pulse 1.2s infinite; }
/* 运功时寿元条开始「烧」：四倍的代价必须和三倍的收益一样显眼，界面不能只报喜。
   与 .urgent（寿元将尽，整条转红闪烁）刻意区分——这里只在金色填充上压一道红辉光、
   边框转红，说的是「正在飞快消耗」而不是「快没了」。两者可以同时成立，各说各的。 */
#life-bar.burning { border-color: var(--danger); }
#life-bar.burning .fill { box-shadow: 0 0 10px rgba(168,50,42,0.95); }
@keyframes pulse { 50% { opacity: 0.45; } }
#stage { text-align: center; padding: 24px 0; }

/* ===== 修为圆环 ===== */
/* 圆环内是绝对定位的浮层：SVG 走文档流撑出 260px 高度，
   数字压在环内上半部，打坐者占下半部，两者互不遮挡；
   #overflow-text 留在文档流里，自然落到环下方。 */
#cult-ring { position: relative; width: 260px; margin: 0 auto; }
#ring-svg { display: block; width: 260px; height: 260px; overflow: visible; }
.ring-track { fill: none; stroke: #2a2118; stroke-width: 6; }
.ring-fill {
  fill: none; stroke: var(--gold); stroke-width: 6; stroke-linecap: round;
  /* 转 -90° 让进度从正上方起笔、顺时针推进。SVG 元素上必须写死
     transform-box，否则各浏览器对 transform-origin 参照系的解释不一致。 */
  transform: rotate(-90deg); transform-box: view-box; transform-origin: 110px 110px;
  transition: stroke-dashoffset 140ms linear;
  filter: drop-shadow(0 0 6px rgba(201,162,39,0.6));
}
.ring-aura {
  fill: none; stroke: rgba(201,162,39,0.22); stroke-width: 1;
  /* 周长 2π×86 ≈ 540.35，虚线周期取 14.22 恰好排满 38 段，转起来没有接缝 */
  stroke-dasharray: 4 10.22;
  animation: spin 12s linear infinite;
  transform-box: view-box; transform-origin: 110px 110px;
}
.ring-aura.overflowing {
  stroke: rgba(201,162,39,0.75); stroke-width: 1.5; animation-duration: 3s;
}
/* 运功时灵气环急转。0.8 秒一圈是刻意挑的：12 秒（常态）与 3 秒（溢出）看着都还像
   「在转」，0.8 秒才像「在冲」，两种状态一眼可辨。选择器带 id，特异性天然压过
   .ring-aura.overflowing——溢出与运功同时成立时以运功为先，它是此刻正在发生的事。 */
#cult-ring.boosting .ring-aura {
  stroke: rgba(201,162,39,0.9); stroke-width: 2; animation-duration: 0.8s;
  filter: drop-shadow(0 0 6px rgba(201,162,39,0.55));
}
/* 打坐的人呼吸也跟着急起来：4 秒一息 → 0.9 秒一息 */
#cult-ring.boosting #meditator { animation-duration: 0.9s; }
/* 速率数字亮起来。数值本身已经 ×3 跳变，这一下只是给那次跳变一个由头，
   否则玩家会以为自己看错了 */
#cult-ring.boosting #rate-text {
  opacity: 1; color: var(--gold); text-shadow: 0 0 10px rgba(201,162,39,0.5);
}
@keyframes spin { to { transform: rotate(360deg); } }
.fig { fill: var(--gold-dim); stroke: var(--ink); stroke-width: 1.6; }
.arm { fill: none; stroke: var(--gold-dim); stroke-width: 6; stroke-linecap: round; }
.arm-gap { fill: none; stroke: var(--ink); stroke-width: 10; stroke-linecap: round; }
#meditator { animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.5; } }
#cult-text {
  position: absolute; left: 0; right: 0; top: 52px;
  font-size: 24px; line-height: 1.4; color: var(--gold); letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 12px rgba(201,162,39,0.35);
}
#rate-text {
  position: absolute; left: 0; right: 0; top: 88px;
  font-size: 12px; line-height: 1.4; opacity: 0.6; font-variant-numeric: tabular-nums;
}
/* 留出固定高度，溢出提示出现/消失时突破按钮不会跳动 */
#overflow-text {
  font-size: 12px; line-height: 1.4; min-height: 17px; margin-top: 6px;
  color: var(--gold); letter-spacing: 1px;
}
#breakthrough-btn {
  margin-top: 20px; padding: 10px 32px; font-size: 16px; font-family: inherit;
  background: transparent; color: var(--gold-dim); border: 1px solid var(--gold-dim); cursor: not-allowed;
}
#breakthrough-btn.ready {
  color: var(--gold); border-color: var(--gold); cursor: pointer;
  box-shadow: 0 0 12px rgba(201,162,39,0.5); animation: pulse 1.6s infinite;
}
/* ===== 心法姿态条 ===== */
/* auto-fit 一条规则吃下两种布局：心法砍到两门之后，空轨道被 auto-fit 收掉、1fr 把余量
   分给剩下两格，于是桌面（#stage 约 496px）与手机 375px 下都是各占一半的两个大格子，
   远超 44px 触摸目标。将来若再添一门，这条规则不用改。 */
#stance-bar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
  gap: 6px; margin-top: 18px;
}
.stance-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 46px; padding: 6px 4px;
  font-family: inherit; font-size: 14px; line-height: 1.3;
  background: transparent; color: var(--gold-dim);
  border: 1px solid var(--gold-dim); cursor: pointer;
  transition: color 120ms, border-color 120ms, background 120ms;
}
.stance-btn:hover { color: var(--gold); border-color: var(--gold); background: rgba(201,162,39,0.06); }
/* 当前所行的一门要一眼可辨：金线 + 内外双重辉光，与突破按钮的 .ready 同一套语汇 */
.stance-btn.active {
  color: var(--gold); border-color: var(--gold); background: rgba(201,162,39,0.12);
  box-shadow: 0 0 8px rgba(201,162,39,0.35), inset 0 0 10px rgba(201,162,39,0.08);
}
.stance-name { letter-spacing: 1px; }
.stance-stats {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0 6px;
  font-size: 10px; opacity: 0.75; font-variant-numeric: tabular-nums;
}
/* 换行只在数值之间发生，「寿耗×0.45」自己不能被拦腰截断 */
.stance-stats span { white-space: nowrap; }
/* 定高，切换心法时下方的日志不会跟着上下跳 */
#stance-desc {
  margin-top: 8px; min-height: 36px; font-size: 12px; line-height: 1.5;
  color: var(--gold-dim); letter-spacing: 0.5px;
}

/* ===== 长按运功 ===== */
/* 全游戏唯一需要「按住不放」的控件，所以做得比心法按钮更大更实：整条 52px 高的横条
   都是触摸目标（手机上 56px），名字与标注并排居中——按住的时候眼睛在圆环上，
   按钮只需要一个够大、不用瞄的落点。
   下面三条移动端属性都是必需的，缺一条长按就会被系统抢走：
     touch-action: manipulation   去掉 300ms 点击延迟与双击缩放（连点会被认成缩放手势）
     user-select: none            长按不要把「运功」二字选中、不要弹出文本选择手柄
     -webkit-touch-callout: none  iOS 长按不要弹系统菜单——那会当场打断加速 */
#boost-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 52px; margin-top: 12px; padding: 8px 12px;
  font-family: inherit; font-size: 16px; line-height: 1.3;
  background: transparent; color: var(--gold-dim);
  border: 1px solid var(--gold-dim); cursor: pointer;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: color 100ms, border-color 100ms, background 100ms, box-shadow 100ms;
}
.boost-name { letter-spacing: 4px; }
.boost-stats {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0 6px;
  font-size: 11px; opacity: 0.75; font-variant-numeric: tabular-nums;
}
/* 换行只在数值之间发生，「寿耗×4」自己不能被拦腰截断 */
.boost-stats span { white-space: nowrap; }
#boost-btn:hover { color: var(--gold); border-color: var(--gold); background: rgba(201,162,39,0.06); }
/* 按住时：金线 + 双重辉光 + 微微下沉，指头底下要有「按实了」的实感。刻意与心法的
   .active 拉开距离——那是个常驻状态，这是此刻正在发生的事，所以它会自己呼吸。
   呼吸用专门的 boost-glow 而不是复用 pulse：pulse 改的是整体 opacity，会把金线和
   字一起压暗，按住时反而像在闪断；这里只让辉光张缩，字始终读得清。 */
#boost-btn.boosting {
  color: var(--gold); border-color: var(--gold); background: rgba(201,162,39,0.18);
  box-shadow: 0 0 16px rgba(201,162,39,0.55), inset 0 0 14px rgba(201,162,39,0.14);
  transform: translateY(1px);
  animation: boost-glow 0.7s ease-in-out infinite;
}
@keyframes boost-glow {
  50% { box-shadow: 0 0 26px rgba(201,162,39,0.85), inset 0 0 20px rgba(201,162,39,0.24); }
}
#boost-btn:disabled { opacity: 0.45; cursor: not-allowed; }
/* 键盘可达：聚焦后按住空格 / 回车同样能行功，焦点圈必须看得见 */
#boost-btn:focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; }
#boost-note { margin-top: 6px; font-size: 11px; opacity: 0.55; letter-spacing: 0.5px; }

/* ===== 丹房 ===== */
/* 面板在 #stage 内部（居中排版的地盘），这里把文字掰回左对齐：
   五行丹药是一张要横着扫的表，居中会让名字、效果、价钱三列全部对不齐。 */
#pill-panel {
  margin-top: 18px; padding: 10px; text-align: left;
  border: 1px solid var(--gold-dim); background: var(--ink-2);
}
#pill-panel[hidden] { display: none; }
/* 灵材数额挂在「丹房」二字旁边。panel-title 的 4px 字距会把这行拉散，就地清掉 */
.pill-sum { margin-left: 8px; font-size: 11px; letter-spacing: 0; opacity: 0.8; }
.pill-sum b { color: var(--gold); font-variant-numeric: tabular-nums; }
/* 整行即按钮：桌面上一行扫完三列信息，手机上整条 44px 高的横条都是触摸目标，
   不必去够行尾一个小方块。名字列定宽 3.6em（五味丹名都是三字）让效果列对齐，
   价钱列压在最右，玩家竖着一眼就能比出贵贱。 */
.pill-btn {
  display: grid; grid-template-columns: 3.6em 1fr auto; align-items: center; gap: 8px;
  width: 100%; min-height: 44px; margin: 4px 0; padding: 6px 10px;
  font-family: inherit; font-size: 14px; line-height: 1.3; text-align: left;
  background: transparent; color: var(--gold-dim);
  border: 1px solid var(--gold-dim); cursor: pointer;
  transition: color 120ms, border-color 120ms, background 120ms;
}
.pill-name { letter-spacing: 1px; white-space: nowrap; }
.pill-effect {
  display: flex; flex-wrap: wrap; gap: 0 6px;
  font-size: 11px; opacity: 0.75; font-variant-numeric: tabular-nums;
}
/* 换行只在标注之间发生，「增寿1320载」自己不能被拦腰截断 */
.pill-effect span { white-space: nowrap; }
/* 价钱右对齐并留出三位数的位置，五行数字才竖得成一列 */
.pill-cost {
  min-width: 2.4em; text-align: right;
  color: var(--gold); font-variant-numeric: tabular-nums;
}
/* 炼得起的才亮金线，与突破按钮的 .ready、心法的 .active 同一套语汇。
   不够时压暗但仍可读——玩家要能看见自己在攒向哪一颗 */
.pill-btn.ready:hover { border-color: var(--gold); background: rgba(201,162,39,0.08); }
.pill-btn.ready { color: var(--gold); border-color: var(--gold-dim); }
.pill-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.pill-btn:disabled .pill-cost { color: var(--gold-dim); }

/* ===== 秘境 ===== */
/* 与丹房同一套骨架（面板在 #stage 内部，文字掰回左对齐），只是列宽不同：
   名字列 7.2em 容得下「再深一层（第 7 层）」，标注列吃掉剩下的宽度。
   没有第三列——上一版最右那列印的是「去不去」要看的耗时，而如今耗时每层都一样，
   要看的是四项收益与险率，它们全在标注列里。 */
#secret-panel {
  margin-top: 18px; padding: 10px; text-align: left;
  border: 1px solid var(--gold-dim); background: var(--ink-2);
}
#secret-panel[hidden], #secret-enter-box[hidden], #secret-going[hidden],
#secret-decide[hidden], #secret-text[hidden] { display: none; }
.secret-btn {
  display: grid; grid-template-columns: 7.2em 1fr; align-items: center; gap: 8px;
  width: 100%; min-height: 44px; margin: 4px 0; padding: 6px 10px;
  font-family: inherit; font-size: 14px; line-height: 1.3; text-align: left;
  background: transparent; color: var(--gold-dim);
  border: 1px solid var(--gold-dim); cursor: pointer;
  transition: color 120ms, border-color 120ms, background 120ms;
}
.secret-name { letter-spacing: 1px; white-space: nowrap; }
.secret-effect {
  display: flex; flex-wrap: wrap; gap: 0 6px;
  font-size: 11px; opacity: 0.75; font-variant-numeric: tabular-nums;
}
/* 换行只在标注之间发生，「险 40%·寿−8%」自己不能被拦腰截断 */
.secret-effect span { white-space: nowrap; }
.secret-btn.ready:hover { border-color: var(--gold); background: rgba(201,162,39,0.08); }
.secret-btn.ready { color: var(--gold); border-color: var(--gold-dim); }
.secret-btn:disabled { opacity: 0.45; cursor: not-allowed; }
/* 层进度。这是全游戏第一个会自己推进的进度条，所以它要比寿元条更显眼一点：
   金线加一道辉光，宽度过渡跟着 .fill 的 120ms 走，肉眼能看出它在动。 */
#secret-going { padding: 4px 2px 2px; }
#secret-status { font-size: 14px; color: var(--gold-dim); letter-spacing: 1px; margin-bottom: 8px; }
#secret-status b { color: var(--gold); font-size: 16px; font-variant-numeric: tabular-nums; }
#secret-going .bar { min-width: 0; height: 8px; }
#secret-fill { box-shadow: 0 0 8px rgba(201,162,39,0.5); }
.secret-note { margin-top: 6px; font-size: 11px; opacity: 0.6; letter-spacing: 0.5px; }
/* 未落袋的收获。这一行是赌注显示器：撞上险境它整行归零，所以给足对比度，
   不能和那句灰色的 note 混成一片。 */
#secret-haul {
  margin-top: 8px; font-size: 13px; color: var(--gold);
  font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
}
.haul-label {
  margin-right: 8px; padding: 1px 5px; font-size: 11px; letter-spacing: 1px;
  color: var(--gold-dim); border: 1px solid var(--gold-dim); opacity: 0.8;
}
/* 每层的白描。压暗、缩小、留出行距，读起来是「见闻」而不是「读数」——
   它挨着两个决定按钮，字号若与按钮持平，会把视线从决定上引开。 */
#secret-text {
  margin: 10px 0 2px; font-size: 12.5px; line-height: 1.75;
  color: var(--text); opacity: 0.72; letter-spacing: 0.5px;
}
#secret-decide { margin-top: 8px; }
/* 弹层里逐层回顾的那几句，与面板上的白描同一套语汇，只是每行前面挂着层号。
   刻意掰回左对齐（弹层里其余文字是居中的）：带层号的行居中之后，那几个数字
   参差地悬在半空，读起来不像一份逐层的行程记录 */
.secret-recall { font-size: 13px; line-height: 1.9; opacity: 0.78; text-align: left; }

/* ===== 神通列表 ===== */
/* 神通能攒到十几条，一条一行 desc 会把侧栏撑成几屏高。改成一行一条：
   名字做钉子靠左，数值标注压到右侧。侧栏净宽只有 178px，是这里所有尺寸的来源：
   名字用 13px + 6px 内边距时，全表最长的太乙分光（四字名 + 三段标注）实测要 179px，
   差 1px 就折成两行；降到 12px / 5px 并把标注间距收到 4px 之后是 171px，留 7px 余量。
   .st-stats 仍留着 flex-wrap 兜底：将来真有更长的条目，宁可它自己折行，也不许横向溢出。 */
.st-row { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin: 3px 0; }
.st-name { font-size: 12px; padding: 1px 5px; margin: 0; white-space: nowrap; }
.st-stats {
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0 4px;
  font-size: 10px; opacity: 0.75; font-variant-numeric: tabular-nums;
}
/* 换行只在标注之间发生，「速+12%」自己不能被拦腰截断 */
.st-stats span, .st-sum span { white-space: nowrap; }
/* 合计挂在「神通」二字旁边。panel-title 的 4px 字距会把这行拉散，就地清掉 */
.st-sum {
  margin-left: 6px; font-size: 10px; letter-spacing: 0; opacity: 0.75;
  font-variant-numeric: tabular-nums;
}

/* ===== 观星术预告 ===== */
#omen { margin: 0 0 6px; font-size: 13px; letter-spacing: 1px; }
#omen:empty { display: none; }
.omen-label { color: var(--gold-dim); margin-right: 8px; }
.omen-fortune { color: var(--gold); }
.omen-tribulation { color: var(--danger); }

#log-panel { height: 160px; overflow-y: auto; border-top: 1px solid var(--gold-dim); padding-top: 8px; font-size: 13px; }
.log-line { margin: 3px 0; }
.log-age { color: var(--gold-dim); margin-right: 8px; }

.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal { width: min(480px, 88vw); background: var(--ink-2); border: 1px solid var(--gold); padding: 24px; }
.modal-title { color: var(--gold); font-size: 20px; letter-spacing: 6px; text-align: center; margin-bottom: 16px; }
.modal-body { line-height: 1.9; margin-bottom: 20px; }
.event-text { text-indent: 2em; margin: 0; }
.modal-actions { display: flex; flex-direction: column; gap: 8px; }
.modal-btn { padding: 10px; font-family: inherit; font-size: 14px; background: transparent; color: var(--text); border: 1px solid var(--gold-dim); cursor: pointer; }
.modal-btn:hover { color: var(--gold); border-color: var(--gold); background: rgba(201,162,39,0.08); }

#upgrade-box { margin-top: 16px; border-top: 1px solid var(--gold-dim); padding-top: 12px; }
/* 三列定宽而非 space-between：否则每行等级、价格会随左侧名字长短各自错位 */
.upgrade-row { display: grid; grid-template-columns: 1fr auto 56px; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
.upgrade-row small { opacity: 0.6; margin-left: 6px; }
.upgrade-btn { min-width: 48px; padding: 3px 8px; font-family: inherit; background: transparent; color: var(--gold); border: 1px solid var(--gold-dim); cursor: pointer; }
.upgrade-btn:disabled { color: var(--gold-dim); cursor: not-allowed; }

@media (max-width: 720px) {
  /* 全屏启动时内容会延伸到刘海与底部横条下面，用安全区把顶栏顶回来 */
  #app {
    padding: calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
             calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  }
  #top-bar { font-size: 14px; gap: 4px 12px; }

  /* 手机上重排整页顺序：圆环 → 突破 → 日志 → 参考面板。
     日志是事件结果与晋级反馈的唯一出口，塌成一栏后若仍排在
     灵根/天赋/功法/神通之后，它会落到 1000px 开外的位置，
     每看一条都要长划。参考面板才是偶尔查一次的东西，放最后。
     #body 用 display:contents 摊平，让它的子元素直接参与 #app 的排序。 */
  #app { display: flex; flex-direction: column; }
  #body { display: contents; }
  #top-bar   { order: 0; }
  #stage     { order: 1; padding: 12px 0 4px; }
  /* 预告与日志同 order：等值时按源码顺序排，预告自然落在日志正上方。
     不写这条的话它会退回默认 order:0，被顶到跟顶栏一堆去 */
  #omen      { order: 2; }
  #log-panel { order: 2; margin-bottom: 16px; }
  #left-col  { order: 3; }
  #right-col { order: 4; }

  /* iOS 建议触摸目标不小于 44px，弹窗按钮是全局最需要点准的地方 */
  .modal-btn { padding: 14px 10px; font-size: 15px; }
  #breakthrough-btn { padding: 14px 32px; }
  /* 心法条留在 #stage 内部，随 order:1 跟着突破按钮走，不会掉到日志之后。
     这里只把触摸目标放大：两格各占一半宽、48px 高，间距拉到 8px 防误触。 */
  #stance-bar { gap: 8px; margin-top: 14px; }
  .stance-btn { min-height: 48px; font-size: 15px; }
  #stance-desc { min-height: 40px; }
  /* 运功按钮同样留在 #stage 内部，随 order:1 跟着突破按钮走。这里只放大触摸目标：
     56px 高，远超 44px 的下限——它是唯一要按住不放的控件，手指落点得宽裕，
     且滑动中途也不能脱靶（真脱靶了也有 setPointerCapture 兜着，见 main.js） */
  #boost-btn { min-height: 56px; margin-top: 10px; font-size: 17px; }
  /* 丹房同样留在 #stage 内部，随 order:1 跟着突破按钮走。这里只放大触摸目标：
     每行 48px 高、行距拉到 6px 防误触——炼错一颗就是几十枚灵材白扔 */
  #pill-panel { margin-top: 14px; }
  .pill-btn { min-height: 48px; margin: 6px 0; font-size: 15px; }
  .pill-effect { font-size: 11px; }
  /* 秘境同样留在 #stage 内部，随 order:1 跟着突破按钮走。这里只放大触摸目标：
     每行 48px 高、行距 6px 防误触——「再深一层」与「就此出关」贴着摆，点错一个
     就是几十枚灵材连本带利地没了，这两个按钮是全局最不能误触的地方。
     375px 下净宽约 311px：名字列 108px，标注列剩约 195px，
     「灵材 +19 / 神通 20% / 功法 10% / 险 40%·寿−8%」会自己折成两行，
     由 flex-wrap 兜住，绝不横向溢出。 */
  #secret-panel { margin-top: 14px; }
  .secret-btn { min-height: 48px; margin: 6px 0; font-size: 15px; }
  .secret-effect { font-size: 11px; }
  /* 两个决定按钮之间多留一道，防手指连击 */
  #secret-decide .secret-btn + .secret-btn { margin-top: 10px; }
}

/* 关掉双击缩放与 300ms 点击延迟，手机上连点会被识别成缩放手势 */
button, .modal-btn, .upgrade-btn { touch-action: manipulation; }

/* 调试面板：随生产构建发布，按 ~ 开关。刻意用扎眼的终端绿，与水墨主题划清界限 */
#debug-panel {
  position: fixed; right: 12px; bottom: 12px; z-index: 20;
  background: #000; border: 1px solid #3a5; color: #6c9; padding: 12px;
  font-family: ui-monospace, monospace; font-size: 12px; max-width: 300px;
}
#debug-panel button { display: block; width: 100%; margin: 4px 0; font-family: inherit; background: #111; color: #6c9; border: 1px solid #3a5; cursor: pointer; padding: 4px; }
#debug-panel input { width: 70px; background: #111; color: #6c9; border: 1px solid #3a5; }
.debug-title { color: #3a5; margin-bottom: 8px; }
#debug-stats { margin-top: 8px; line-height: 1.6; word-break: break-all; }

</style>
</head>
<body>
<div id="app">
  <header id="top-bar">
    <span id="dao-hao">无名散修</span>
    <span id="realm-name">练气 · 初期</span>
    <div id="life-bar" class="bar"><div id="life-fill" class="fill"></div></div>
    <span id="age-text">16 / 120 载</span>
    <span id="luck-text">气运 0</span>
    <span id="lingcai-text">灵材 0</span>
  </header>

  <div id="body">
    <aside id="left-col">
      <section id="spirit-panel" class="panel"></section>
      <section id="talent-panel" class="panel"></section>
    </aside>

    <main id="stage">
      <div id="cult-ring">
        <svg viewBox="0 0 220 220" id="ring-svg" aria-hidden="true">
          <circle cx="110" cy="110" r="96" class="ring-track"/>
          <circle cx="110" cy="110" r="96" class="ring-fill" id="ring-fill"/>
          <circle cx="110" cy="110" r="86" class="ring-aura" id="ring-aura"/>
          <!-- 打坐剪影。这个尺寸下能读出「人」全靠三处对比：细长的颈、
               直筒不外扩的躯干、明显宽于躯干的盘膝。双臂先描一道底色粗线再压金线，
               臂与躯干之间才会留出空隙——没有这道空隙，整个人就是一口钟。 -->
          <g id="meditator" transform="translate(110,157) scale(1.15)">
            <path class="fig" d="M5,-38 L5,-28 C12,-27 17,-24 17,-17 L18,6 L-18,6 L-17,-17 C-17,-24 -12,-27 -5,-28 L-5,-38 Z"/>
            <path class="arm-gap" d="M15,-21 Q40,-5 4,7"/>
            <path class="arm-gap" d="M-15,-21 Q-40,-5 -4,7"/>
            <path class="arm" d="M15,-21 Q40,-5 4,7"/>
            <path class="arm" d="M-15,-21 Q-40,-5 -4,7"/>
            <path class="fig" d="M-36,10 Q-30,-6 0,0 Q30,-6 36,10 Q0,26 -36,10 Z"/>
            <circle cx="0" cy="-42" r="9.5" class="fig"/>
          </g>
        </svg>
        <div id="cult-text">0 / 100</div>
        <div id="rate-text"></div>
        <div id="overflow-text"></div>
      </div>
      <button id="breakthrough-btn" disabled>修为未足</button>
      <!-- 心法姿态条。刻意留在 #stage 内部：手机端用 flex order 重排的是
           #stage / #log-panel / 两侧栏这几个块，心法属于操作区，跟着突破按钮
           一起走，才不会掉到日志后面去。 -->
      <div id="stance-bar" role="group" aria-label="心法姿态"></div>
      <div id="stance-desc"></div>
      <!-- 长按运功。刻意做成一个动作而不是一门心法：按住则快，松手即停，不留心智负担。
           摆在心法条正下方，因为它与心法相乘——上面选的是「常态怎么修」，这里是
           「此刻冲一下」。同样留在 #stage 内部，随 order:1 跟着突破按钮走。
           按钮上的两个数字由 render 从常量现算，这里不写死。 -->
      <button type="button" id="boost-btn">
        <span class="boost-name">运 功</span>
        <span class="boost-stats" id="boost-stats"></span>
      </button>
      <div id="boost-note">按住即行功，松手即止</div>
      <!-- 丹房。同样刻意留在 #stage 内部：炼丹是操作而非参考，手机端要跟着
           突破按钮一起走，不能掉到日志后面去。金丹之前 render 会把它整个 hidden。
           灵材数额在顶栏已有一份，这里再挂一份——决定「炼哪一颗」时眼睛正落在这，
           不该逼玩家把视线甩回页首。 -->
      <section id="pill-panel" hidden>
        <div class="panel-title">丹房<span class="pill-sum">灵材 <b id="pill-lingcai">0</b></span></div>
        <div id="pill-rows" role="group" aria-label="炼丹"></div>
      </section>
      <!-- 秘境。同样刻意留在 #stage 内部：往下钻是操作而非参考，手机端要跟着
           突破按钮一起走。元婴之前 render 会把它整个 hidden。
           入秘境之后入口让位给层进度；一层探完，两个决定按钮就地出现——
           刻意不用弹层：弹层会打断挂机，而这是个可以慢慢想的决定，不设超时。 -->
      <section id="secret-panel" hidden>
        <div class="panel-title">秘境</div>
        <div id="secret-enter-box">
          <button type="button" id="secret-enter" class="secret-btn">
            <span class="secret-name">入 秘 境</span>
            <span class="secret-effect" id="secret-enter-stats"></span>
          </button>
          <div class="secret-note" id="secret-enter-note"></div>
        </div>
        <div id="secret-going" hidden>
          <div id="secret-status"></div>
          <div class="bar"><div id="secret-fill" class="fill"></div></div>
          <div id="secret-haul"></div>
          <div id="secret-text"></div>
          <div id="secret-decide" role="group" aria-label="秘境抉择" hidden>
            <button type="button" id="secret-deeper" class="secret-btn">
              <span class="secret-name" id="secret-deeper-name">再深一层</span>
              <span class="secret-effect" id="secret-deeper-stats"></span>
            </button>
            <button type="button" id="secret-leave" class="secret-btn">
              <span class="secret-name">就此出关</span>
              <span class="secret-effect" id="secret-leave-stats"></span>
            </button>
          </div>
          <div class="secret-note" id="secret-note"></div>
        </div>
      </section>
    </main>

    <aside id="right-col">
      <section id="gongfa-panel" class="panel"></section>
      <section id="shentong-panel" class="panel"></section>
      <section id="debuff-panel" class="panel"></section>
    </aside>
  </div>

  <!-- 观星术的预告。紧挨编年史：一个说下一桩将至，一个记已了之事，读起来是同一条时间线。
       没有这门神通时 render 会把它清空，:empty 直接收掉，不占位。 -->
  <div id="omen"></div>

  <footer id="log-panel"></footer>
</div>
<div id="debug-panel" hidden>
  <div class="debug-title">调试面板（~ 开关）</div>
  <label>时间倍速 <input id="debug-speed" type="number" value="1" min="1" max="1000" step="10"></label>
  <button id="debug-fill">修为填满</button>
  <button id="debug-event">立刻触发事件</button>
  <button id="debug-realm">境界 +1</button>
  <button id="debug-age">寿元 −80%</button>
  <button id="debug-reset">清档重来</button>
  <div id="debug-stats"></div>
</div>
<div id="modal-root"></div>
<script>
// ===== data/realms.js =====
// 九大境界 + 飞升。life 为该境界寿元上限（岁），chance 为突破到下一境界的基础成功率
const REALMS = [
  { name: '练气', life: 120,   chance: 0.90 },
  { name: '筑基', life: 300,   chance: 0.75 },
  { name: '金丹', life: 600,   chance: 0.60 },
  { name: '元婴', life: 1200,  chance: 0.50 },
  { name: '化神', life: 2200,  chance: 0.42 },
  { name: '炼虚', life: 4000,  chance: 0.35 },
  { name: '合体', life: 7000,  chance: 0.28 },
  { name: '大乘', life: 12000, chance: 0.22 },
  { name: '渡劫', life: 22000, chance: 0.15 },
  { name: '飞升', life: Infinity, chance: 0 },
];

const SUB_NAMES = ['初期', '中期', '后期', '圆满'];

// 修为曲线常量，改动前先跑 tests/balance.test.mjs
const REQ_BASE = 100;
const REQ_GROWTH = 1.55;
const RATE_BASE = 8.33;
const RATE_GROWTH = 1.348;

const START_AGE = 16;
const ASCEND_REALM = 9;


// ===== data/spirits.js =====
const ELEMENTS = ['金', '木', '水', '火', '土'];
const MUTANT_ELEMENTS = ['雷', '冰', '风'];

// weight 之和必须为 100
const SPIRITS = [
  { id: 'tian',   name: '天灵根',   weight: 1,  count: 1, mutant: false, mult: 3.0,  breakAdd: 0,    lifeAdd: 0,   desc: '万中无一，大道可期' },
  { id: 'mutant', name: '变异灵根', weight: 5,  count: 1, mutant: true,  mult: 2.2,  breakAdd: 0.10, lifeAdd: 0,   desc: '天生异种，渡劫易成' },
  { id: 'shuang', name: '双灵根',   weight: 14, count: 2, mutant: false, mult: 1.6,  breakAdd: 0,    lifeAdd: 0,   desc: '资质上佳' },
  { id: 'san',    name: '三灵根',   weight: 25, count: 3, mutant: false, mult: 1.25, breakAdd: 0,    lifeAdd: 0,   desc: '资质中平' },
  { id: 'si',     name: '四灵根',   weight: 30, count: 4, mutant: false, mult: 1.0,  breakAdd: 0,    lifeAdd: 0,   desc: '寻常之姿' },
  { id: 'wu',     name: '五灵根',   weight: 25, count: 5, mutant: false, mult: 0.7,  breakAdd: 0,    lifeAdd: 0.20, desc: '伪灵根，修行缓慢，然根基绵长' },
];


// ===== data/talents.js =====
// 开局抽 1~2 个（30% 概率抽到 2 个），同局不重复。
//
// 这是「每局不一样」最强的来源：抽到什么在开局第一秒就定死，中途换不掉。
// 所以这张表要有落差——既有让人想立刻开挂机的（逆天改命、雷劫之体），
// 也有让人想立刻重开的（经脉淤塞、命薄如纸）。全是温和正面就等于没有天赋系统。
//
// 数值一律走声明式字段（rateAdd / breakAdd / lifeAdd / intervalAdd / fortuneAdd），
// 由 formulas.js 统一求和。gongfaAmp / lateBloomer / luckyWeight 是三个老的行为钩子，
// 各自在公式层与事件层有专门分支，新增天赋不要再造这类标志。
//
// 注意 fortuneAdd 是双刃的：它同时放大机缘收益与劫难损失（见 actions.resolveEvent），
// 所以「饕餮之躯 +60%」不是纯增益，而是把一局的方差整个拉大。
const TALENTS = [
  { id: 'guomubuwang', name: '过目不忘', desc: '功法效果 +50%',                          gongfaAmp: 1.5 },
  { id: 'tianshengdaoti', name: '天生道体', desc: '突破成功率加成 +15%',                  breakAdd: 0.15 },
  { id: 'changshengzhong', name: '长生种', desc: '寿元上限 +30%',                        lifeAdd: 0.30 },
  { id: 'qiyunzhizi', name: '气运之子', desc: '事件触发间隔 −40%',                        intervalAdd: -0.40 },
  { id: 'xinmochanshen', name: '心魔缠身', desc: '修炼 +40%，突破成功率加成 −10%',        rateAdd: 0.40, breakAdd: -0.10 },
  { id: 'sanxiuchushen', name: '散修出身', desc: '机缘收益与劫难损失 +25%，修炼 −15%',     fortuneAdd: 0.25, rateAdd: -0.15 },
  { id: 'daqiwancheng', name: '大器晚成', desc: '化神前修炼 −20%，化神后 +60%',            lateBloomer: true },
  { id: 'fuyuanshenhou', name: '福缘深厚', desc: '机缘事件出现权重翻倍',                   luckyWeight: 2 },

  // 高风险高回报：一大正 + 一明确负，抽到就得改打法
  { id: 'nitiangaiming', name: '逆天改命', desc: '修炼 +55%，寿元上限 −30%',              rateAdd: 0.55, lifeAdd: -0.30 },
  { id: 'leijiezhiti', name: '雷劫之体', desc: '突破成功率加成 +30%，寿元上限 −25%',       breakAdd: 0.30, lifeAdd: -0.25 },
  { id: 'xuemaifanzu', name: '血脉返祖', desc: '寿元上限 +60%，修炼 −30%',                lifeAdd: 0.60, rateAdd: -0.30 },
  { id: 'taotiezhiqu', name: '饕餮之躯', desc: '机缘收益与劫难损失 +60%，寿元上限 −20%',   fortuneAdd: 0.60, lifeAdd: -0.20 },
  { id: 'hongchenlianxin', name: '红尘炼心', desc: '事件触发间隔 −50%，突破成功率加成 −15%', intervalAdd: -0.50, breakAdd: -0.15 },

  // 纯负面：幅度不大，但开局就矮人一头
  { id: 'jingmaiyuse', name: '经脉淤塞', desc: '经脉天生不畅，修炼 −20%',                  rateAdd: -0.20 },
  { id: 'mingboruzhi', name: '命薄如纸', desc: '生来体弱，寿元上限 −18%',                  lifeAdd: -0.18 },

  // 温和正面：不改打法，但让开局顺一点
  { id: 'ziqidonglai', name: '紫气东来', desc: '机缘收益与劫难损失 +20%，突破成功率加成 +5%', fortuneAdd: 0.20, breakAdd: 0.05 },
  { id: 'xianfengdaogu', name: '仙风道骨', desc: '寿元上限 +15%，突破成功率加成 +8%',       lifeAdd: 0.15, breakAdd: 0.08 },
  { id: 'wenjiqiwu', name: '闻鸡起舞', desc: '勤能补拙，修炼 +20%',                        rateAdd: 0.20 },
  { id: 'guangjieshanyuan', name: '广结善缘', desc: '机缘收益与劫难损失 +15%，事件触发间隔 −15%', fortuneAdd: 0.15, intervalAdd: -0.15 },
  { id: 'xinruzhishui', name: '心如止水', desc: '突破成功率加成 +12%，事件触发间隔 +10%',   breakAdd: 0.12, intervalAdd: 0.10 },
];


// ===== data/arts.js =====
// 功法：主修一门，可更换。tier 为品阶，mult 直乘修炼速率，其余字段进各自的加法桶。
//
// 每一门都必须有代价，不存在纯数值升级——否则「换不换功法」就不是抉择，只是点一下确认。
// 代价可以是显式的负字段，也可以是同阶里偏低的倍率（磐石心经）。
// 品阶只约束「同阶最高倍率随品阶递增」，同阶内部允许专精型比通用型倍率低。
// 改动前先跑 tests/data.test.mjs 里的品阶阶梯与代价用例。
const GONGFA = {

// 从符合当前境界的池中加权抽取，最近 8 个不重复
function pickEvent(state, rnd = Math.random) {
  const pool = poolFor(state.realm);
  const recent = state.recentEventIds ?? [];
  let candidates = EVENTS.filter((e) => e.pool === pool && !recent.includes(e.id));
  if (candidates.length === 0) candidates = EVENTS.filter((e) => e.pool === pool);
  if (candidates.length === 0) candidates = EVENTS;
  if (candidates.length === 0) return null;

  // 气运与「福缘深厚」都只抬高机缘的权重，不改变劫难
  const luckyWeight = (state.talentIds ?? []).includes('fuyuanshenhou') ? 2 : 1;
  const luckBonus = Math.max(0, state.luck ?? 0) * 0.2;
  const weights = candidates.map((e) => (e.type === 'fortune' ? luckyWeight + luckBonus : 1));
  const total = weights.reduce((a, w) => a + w, 0);
  let roll = rnd() * total;
  for (let i = 0; i < candidates.length; i++) {
    if (roll < weights[i]) return candidates[i].id;
    roll -= weights[i];
  }
  return candidates[candidates.length - 1].id;
}

function poolFor(realm) {
  if (realm <= 2) return 'early';
  if (realm <= 5) return 'mid';
  return 'late';
}

function findEvent(id) {
  return EVENTS.find((e) => e.id === id) ?? null;
}

// 心法姿态：随时可切，无冷却、无消耗。同一时刻只能行一门，机会成本本身就是抉择。
//
// 两门而非从前的四门。这一版砍掉了「烈火行功」与「抱元守一」，各有各的理由：
//
//   烈火行功本该是个动作，不是一个模式。玩家想「冲一下」，得先点一个档位、事后还要记着
//   切回来，冲刺这件事凭空背上一身心智负担。它已改成长按运功（BOOST_RATE_MULT /
//   BOOST_AGE_MULT，见 logic/formulas.js）：想快就按住，松手即停，且与心法相乘而非替代。
//
//   抱元守一必须删。它的 breakAdd 只读「按下突破那一刻」的心法，而切心法零成本零冷却，
//   于是最优解永远是全程行别的心法、突破前一瞬间才切过去——对懂技巧的人是免费的 +30%，
//   对不懂的人是实打实的半速负担。突破前的准备手段还剩两个（溢出攒修为 +30 个百分点、
//   固元丹 +12 个百分点），删掉它不缺表达。
//
// breakAdd 这一列随抱元守一整体删除，没有留成全 0 的死代码：留着的话，下一个人会以为
// 心法还有突破这一维，而 breakthroughChance 里早已不再向心法求和。
//
// 于是心法只剩「修炼速率 / 寿元」两维：rate 乘修炼速率，age 乘寿元消耗速度。
// 关键在 rate / age 这一列的比值——它就是「每一点寿元换来多少修为」：
//   平心静气 1.0 是基准；胎息 2.67（0.4/0.15）最高，因 rate 最低而真实耗时最长，
//   是寿元见底时的唯一活路。长按运功自己的比值是 0.75（3.0/4.0），与心法相乘之后
//   「胎息 + 运功」得 2.0——比胎息省得少、比平心静气省得多。那个中间档是刻意留的
//   组合空间：平心静气里运功最快，胎息里运功慢但省寿元。
// 改动任一数值前先跑 tests/stances.test.mjs 里的效率关系用例。
const STANCES = {
  pingxin: { id: 'pingxin', name: '平心静气', rate: 1.0, age: 1.0,  desc: '不疾不徐，无过无不及，守常而已' },
  taixi:   { id: 'taixi',   name: '胎息',     rate: 0.4, age: 0.15, desc: '息如未生，最省寿元，然功成须以光阴相抵' },

// 未知 id 一律回退到平心静气：老存档没有这个字段，坏值也不该让公式返回 NaN。
// 这条路也接住了所有被删掉的旧心法——老存档里存的 'liehuo' / 'baoyuan' / 'jingguan'
// 现在都只是普通的未知 id，不需要专门的迁移代码，走这条回退路径即可。
// 用 hasOwn 而非 `STANCES[id] ?? 默认值`——后者遇到 'constructor'、'toString' 这类
// 原型链上的键会返回一个函数，公式随即算出 NaN，整局静默烂掉。
function findStance(id) {
  return Object.hasOwn(STANCES, id) ? STANCES[id] : STANCES.pingxin;
}

// ===== data/secrets.js =====
// 秘境探索：逐层深入，见好就收。
//
// 上一版是三个预设档位（浅探/深入/直入核心），出发之后到归来之前玩家没有任何决定——
// 「射后不理」。玩家实测的反馈就一句：太简单了。整个活动只有一个决定，而且是在开始时
// 做的，做完就只剩等。
//
// 这一版整体换成 push-your-luck：只有一个「入秘境」按钮，秘境分层，每探完一层玩家必须
// 决定「再深一层」还是「就此出关」。收获只有主动出关才落袋；撞上险境则强制出关，
// 未落袋的收获全部损失。决定从「一次」变成「每层一次」，而且每一次都发生在信息更新之后
// （手上攒了多少、下一层多险），这才是这个玩法真正的内容。
//
// 代价与上一版一致，不重新定价：探层期间修炼速度只剩四成、被动灵材断供、寿元照常消耗。
const SECRET_UNLOCK_REALM = 3; // 元婴。此前寿元太薄，一次深入就是半条命

// 最深七层。上限不是随手取的整数：见下面 secretLayer 的推导，第 4~5 层之间就是期望的
// 拐点，七层给了「明知期望转负仍要再赌两层」的空间，也让全通成为一件稀有但真的会发生的事。
const SECRET_MAX_LAYER = 7;

// 每深一层的耗时 = 这个系数 × 境界初期那一小层的裸装耗时。
//
// 基准取「境界初期」（sub 固定为 0）而不是当前小层，这是上一版修过的一个 bug，保留：
// levelSeconds 按 1.15^n 指数增长，若按当前小层缩放，同一境界内小层初期出发就比圆满
// 出发便宜 1.15^3 ≈ 1.52 倍——而灵材是绝对值，于是最优解变成「攒着修为不去突破、
// 先刷一趟秘境」。改成只认境界之后，同境界内任何时候入秘境每层耗时都相同，境界之间
// 仍按 levelSeconds 正确缩放（元婴初期每层 26 载，渡劫初期每层 637 载），
// 抉择的重量九境一致。别改回 state.sub 去。
//
// 数值上恰好与 formulas.js 的 EXPEDITION_RATE_MULT 同为 0.4，但两者毫无关系：
// 一个是「一层要走多久」，一个是「探层期间修炼打几折」。别顺手合成一个常量。
const SECRET_LAYER_TIME_FACTOR = 0.4;

// ===== 每层的收益与风险 =====
//
// 全部是层数 n 的线性函数，故意选成让最优停手点落在中段的一组数：
//
//   灵材 4+3n · 神通 0.04n · 功法 0.02n · 险境 0.08n · 折寿比例 0.015n
//
// 推导：在第 n 层手上攒了 B 枚（= 前 n−1 层的累计）、这一层能得 g 枚、险境概率 r，
// 则「再深一层」的期望是 (1−r)(B+g)，比 B 大才值得推，即 g/(B+g) > r：
//
//   第1层  B=0   g=7   1.00 > 0.08  推
//   第2层  B=7   g=10  0.59 > 0.16  推
//   第3层  B=17  g=13  0.43 > 0.24  推
//   第4层  B=30  g=16  0.35 > 0.32  推（勉强）
//   第5层  B=46  g=19  0.29 < 0.40  停
//
// 于是纯灵材视角的最优停手在第 4~5 层之间，落袋约 46 枚（实测蒙特卡洛：固定第 k 层
// 出关的期望落袋分别是 6.4 / 13.1 / 17.6 / 18.4 / 15.6 / 10.8 / 6.1 枚，峰值在 k=4，
// 且 k=3 与 k=4 只差 0.8 枚——这个「几乎持平」是刻意的，它让第 4 层那个决定真的两难）。
//
// 而神通/功法掉落率随层数线性升（第 7 层 28% / 14%，是第 1 层的七倍），给了「明知
// 期望转负也要再赌一层」的理由——秘境是去拿挂机拿不到的东西的地方，不是刷进度的地方，
// 所以真正促成深入的动机必须是掉落，而不是灵材。这正是 push-your-luck 该有的手感。
//
// 七层全通的概率是 0.92×0.84×0.76×0.68×0.60×0.52×0.44 ≈ 5.5%，总收获 112 枚。
// 稀有但可能，值得追。
//
// lifeCostRatio 取「当前境界寿元上限的比例」而非绝对年数——REALMS[].life 从 120 跳到
// 22000，绝对数在两头必有一头荒唐。
//
// 返回 null 而非兜底某一层：层号越界时猜错就是玩家白丢几百载寿元（与 findPill 同一条理由）。
function secretLayer(n) {
  if (!Number.isInteger(n) || n < 1 || n > SECRET_MAX_LAYER) return null;
  return {
    layer: n,
    lingcai: 4 + 3 * n,
    shentongChance: 0.04 * n,
    gongfaChance: 0.02 * n,
    riskChance: 0.08 * n,
    lifeCostRatio: 0.015 * n,
  };
}

    '地上再无尘土，只余一层极细的白灰，踩下去无声。',
    '你终于听清了那个声音。它一直在念你的名字，从你进来那一刻起。',
    '前方是一扇门，门上九道封印，八道已经断了。',
  ],
];

// 抽这一层的白描。抽签放在结算随机序列的最后一位（见 actions.resolveLayer 的注释），
// 层号越界时给空串而不是抛——文案是装饰，不该有能力弄死一趟探索。
function pickLayerText(n, rnd = Math.random) {
  const list = SECRET_LAYER_TEXTS[n - 1] ?? [];
  if (list.length === 0) return '';
  return list[Math.floor(rnd() * list.length) % list.length];
}

// ===== 掉落池 =====
//
// 分段直接复用事件的 poolFor(realm)（early ≤2 / mid ≤5 / late），不另立一套：
// 「这个境界能遇上什么」全游戏只该有一个答案。练气修士不该从秘境里捧出仙阶功法，
// 也不该在渡劫期还捡到玄阶残卷。
//
// 功法按 tier 分组而不是列 id：品阶是 GONGFA 表自己的字段，新增一门功法只改那张表，
// 这里不必跟着改。黄阶（引气诀）被自然排除在外——它是起点，不是掉落物。
// 这套分段与事件表里各池实际给出的功法逐一吻合（early 全玄阶、mid 全地阶、late 天/仙），
// 因此秘境不会成为绕过事件池的后门。
const SECRET_GONGFA_TIERS = { early: ['玄'], mid: ['地'], late: ['天', '仙'] };

function secretGongfaPool(realm) {
  const tiers = SECRET_GONGFA_TIERS[poolFor(realm)] ?? [];
  return Object.values(GONGFA).filter((g) => tiers.includes(g.tier)).map((g) => g.id);
}

// 神通没有品阶字段，而 arts.js 不属于本次改动范围，所以只能在这里明列。
// 分组依据同样是事件表里各池现有的给法：温和的被动早期就能捡到，
// 改规则的那几条（归元术、不动明王印）留到 late。
// tests/secrets.test.mjs 有一条守门用例断言这三个池恰好覆盖 SHENTONG 全表且互不重复——
// 将来往 arts.js 加一条神通而忘了在此归池，会当场红掉，而不是静默地永远掉不出来。
const SECRET_SHENTONG_POOL = {
  early: ['guixi', 'guanxing', 'yufeng', 'shunfeng', 'xisui'],
  mid: ['suodi', 'mingxin', 'neishi', 'xunlong', 'jinzhong', 'qingxin'],
  late: ['wulei', 'guiyuan', 'budong', 'zhoutian', 'fenguang'],
};

function secretShentongPool(realm) {
  return SECRET_SHENTONG_POOL[poolFor(realm)] ?? [];
}

// 险境附带的沉疴只从既有 DEBUFFS 里取，不新增种类。
// 剔掉两条与秘境无关的：道基受损专属于冲关失败（且被明心见性免疫），
// 天道烙印是渡劫期天道所记，不该由一趟探险背上。
const SECRET_DEBUFF_IDS = ['handu', 'kuxiu', 'leishang', 'shenshi', 'xinmo'];

// 沉疴持续时间取当前境界寿元上限的比例，与 actions.js 的 DAOJI_DURATION 同一套语义
const SECRET_DEBUFF_RATIO = 0.05;

// 重复的神通、以及不如己有的功法，一律折成灵材，不许白扔。
// 事件里的重复神通折的是修为（DUP_SHENTONG_COMPENSATION = 0.3 层），秘境折灵材：
// 这趟出门本就是为灵材去的，用同一种货币结账，玩家不必换算。
// 10 枚正好是一颗回气丹或洗髓丹——聊胜于无，又绝不至于比正常掉落更划算。
//
// 注意折出来的灵材同样进「未落袋」那一堆，撞上险境一并损失：安慰奖也是收获，
// 收获就得跟着这趟的成败走。
const SECRET_DUP_LINGCAI = 10;

// 掉落的功法若不强于己有，换成灵材而不是硬塞。
//
// 事件里换功法是玩家自己点的选项，愿赌服输；秘境的掉落却是径直落到头上的。
// 太虚化龙经（×4.0）的元婴修士撞上一卷地阶残经，若照事件那套语义直接覆盖，
// 「机缘」当场变成腰斩修炼速度的暗刀——这不是设计，是 bug。按倍率比一次，
// 不如己有的就当残页卖了。倍率是功法的主项，其余字段（寿元、突破、机缘）
// 各有正负，不参与这次比较。
//
// 本版要比两次：拾到那一刻比一次（对照当时会用的那一门），出关落袋时再比一次。
// 两次都必要——探层期间事件照常降临，玩家完全可能在秘境里靠一桩机缘换到更好的功法，
// 此时手里那卷残经就从「升级」变成了「暗刀」。见 actions.withdrawExpedition。
function betterGongfa(currentId, dropId) {
  const cur = GONGFA[currentId] ?? GONGFA.yinqi;
  const drop = GONGFA[dropId];
  return !!drop && drop.mult > cur.mult;
}


// ===== logic/formulas.js =====
// 把（境界, 小层）压成单一等级序号 0..35
function levelIndex(realm, sub) {
  return realm * 4 + sub;
}

// 第 n 级所需修为
function req(n) {
  return REQ_BASE * Math.pow(REQ_GROWTH, n);
}

// 第 n 级的基础修为速率（修为 / 游戏年）
function baseRate(n) {
  return RATE_BASE * Math.pow(RATE_GROWTH, n);
}

// 裸装（无任何加成）修满第 n 级所需的现实秒数。1 现实秒 = 1 游戏年
function levelSeconds(n) {
  return req(n) / baseRate(n);
}

// 每个小层的灵材产出定额。
//
// 关键在于它是「每小层」而不是「每年」：小层耗时按 1.15^n 指数增长，从练气初期的
// 12 秒涨到渡劫圆满的约 1592 秒。产出速率若固定，渡劫一个境界的产出会是练气的上百倍，
// 丹药就没法定价了——前期永远炼不起，后期灵材多到点都点不完，这个资源当场作废。
// 按小层耗时缩放之后，每个境界稳定产出约 16 枚，全程 36 层约 144 枚，
// 而丹药定价 6~40 枚正好是 1.5~10 个小层的积累，每一颗都得掂量。
//
// （事件间隔上已经踩过同一个坑，见 tick.js 的 EVENT_LEVEL_RATIO，修法相同。）
const LINGCAI_PER_LEVEL = 4;

// 每游戏年的灵材产出。分母取裸装耗时而非玩家的实际速率：
// 修得快的人本就更快摸到下一层，灵材产出跟着水涨船高，不必再奖一次。
function lingcaiRate(state) {
  return LINGCAI_PER_LEVEL / levelSeconds(levelIndex(state.realm, state.sub));
}

function findSpirit(id) {
  return SPIRITS.find((s) => s.id === id) ?? SPIRITS[4];
}

function stateTalents(state) {
  return (state.talentIds ?? []).map((id) => TALENTS.find((t) => t.id === id)).filter(Boolean);
}

function hasTalent(state, id) {
  return (state.talentIds ?? []).includes(id);
}

function hasShentong(state, id) {
  return (state.shentongIds ?? []).includes(id);
}

function stateShentong(state) {
  return (state.shentongIds ?? []).map((id) => SHENTONG.find((s) => s.id === id)).filter(Boolean);
}

function sumField(list, field) {
  return list.reduce((acc, x) => acc + (x[field] ?? 0), 0);
}

// 功法倍率。「过目不忘」只放大超出 1.0 的部分
function gongfaMult(state) {
  const g = GONGFA[state.gongfaId] ?? GONGFA.yinqi;
  const amp = hasTalent(state, 'guomubuwang') ? TALENTS.find((t) => t.id === 'guomubuwang').gongfaAmp : 1;
  return 1 + (g.mult - 1) * amp;
}

function hasDebuff(state, id) {
  return (state.debuffs ?? []).some((d) => d.id === id);
}

// 修炼速度的全部加法修正之和
//
// 天赋、神通、功法的数值加成一律走声明式字段，由这里统一求和：加一条内容只改数据表。
// 真正需要分支逻辑的东西（大器晚成的境界拐点、归元术的失败保留率等）才留作硬编码钩子。
function rateAdditive(state) {
  const talents = stateTalents(state);
  let add = sumField(talents, 'rateAdd') + sumField(stateShentong(state), 'rateAdd');
  if (hasTalent(state, 'daqiwancheng')) add += state.realm >= 4 ? 0.60 : -0.20;
  add += (state.upgrades?.daoji ?? 0) * 0.05;
  add -= (state.debuffs ?? []).reduce((sum, d) => sum + (DEBUFFS[d.id]?.rate ?? 0), 0);
  return add;
}

// 探层期间的修炼速度倍率。人在秘境里刀口舔血，不在蒲团上打坐——
// 这个惩罚是整个秘境系统的定价基准，改它等于重定价每一层，先跑 tests/secrets.test.mjs。
const EXPEDITION_RATE_MULT = 0.4;

// 是否正在往下探。tick / formulas / render / actions 都要问这个问题，判据只能有一份。
//
// 关键在于「等待决定」不算在探：玩家在「再深一层 / 就此出关」之间犹豫时，探索是暂停的，
// 修炼速度回到 ×1.0、被动灵材也恢复——你退在洞口歇着，没在探。这不是施舍，是这个设计
// 成立的前提：挂机玩家离开时不该被强制赌博，所以不设超时、不自动出关；而既然可以无限
// 期地停在那里，停留就绝不能有任何代价，否则「不设超时」只是把强制赌博换成了慢性罚款。
// 犹豫没有惩罚，那个决定才是纯粹的。
function isExploring(state) {
  return !!state?.expedition && !state.expedition.awaiting;
}

// 是否人在秘境里（含正在等待决定）。与 isExploring 分开的唯一理由就是上面那条：
// 等待决定期间不吃探层惩罚，但人确实还在洞里，不能再入一趟。
function inSecretRealm(state) {
  return !!state?.expedition;
}

// 每深一层要走多少载。按裸装耗时缩放，与玩家的修炼加成无关——
// 秘境的路有多深是秘境的事，不因为你修得快就变浅。
//
// 基准取「当前境界初期」（sub 固定为 0）的耗时，不能取当前小层。levelSeconds 按
// 1.15^n 指数增长，若按当前小层缩放，同一境界内小层初期入秘境就比圆满入秘境便宜
// 达 1.15^3 ≈ 1.52 倍（34%）——这会奖励「攒着修为不去突破、先刷一趟秘境」这种
// 反直觉的最优解，是两条本来各自成立的约束（耗时按小层缩放、灵材是绝对值）相乘
// 出来的副作用，不是有意为之。改成只认境界、不认小层之后，同一境界内任何时候
// 入秘境每层耗时都相同，境界之间仍按 levelSeconds 正确缩放（这正是 data/secrets.js
// 里「抉择的重量九境一致」的由来）。别「顺手」把这里改回 state.sub 去。
//
// 残余副作用：入秘境时的小层不同，探层期间因 ×0.4 被搁置的绝对修为量也会跟着变——
// cultivationRate 本身随小层升高而增长。这与上面修掉的那个 bug 性质完全不同：它不
// 体现在按钮上（耗时和灵材如今都只认境界，玩家看不到任何「再等等更划算」的信号），
// 量级也小得多，且它是修为曲线指数增长的通性，不专属于秘境。保留不处理。
//
// 现算而不是存一份：玩家完全可能在秘境里突破（探层期间修为照涨，只是慢），
// 此后每一层都按新境界的尺度算路程。已经在走的那一层不受影响——它的 total 在
// 进入那一层的当口就定下了，走到哪算哪（见 actions.descendLayer）。
function layerYears(state) {
  return levelSeconds(levelIndex(state.realm, 0)) * SECRET_LAYER_TIME_FACTOR;
}

// ===== 长按运功 =====
//
// 「运功」是个动作，不是一门心法：手指按住的这段时间里修炼速率 ×3、寿元消耗 ×4。
// 它自带节流，所以刻意不加冷却、不加资源条——手按不了太久，而寿元正以四倍在烧。
//
// 与心法相乘而非替代，这是刻意留的组合空间：平心静气里运功最快（×3.0 速 / ×4.0 寿耗），
// 胎息里运功慢但省寿元（0.4×3.0 = ×1.2 速 / 0.15×4.0 = ×0.6 寿耗，效率 2.0）。
// 两个乘数各自独立，谁也不覆盖谁——秘境探层的 ×0.4 同理，运功是在那个惩罚之上再乘。
//
// state.boosting 是纯粹的输入设备状态，绝不进存档：serialize 归零、deserialize 强制为
// false（见 logic/state.js）。存着「正在运功」的档一旦重载，玩家会在没人按住按钮的
// 情况下按四倍烧寿元，而离线结算走的正是同一条 tick。
const BOOST_RATE_MULT = 3.0;
const BOOST_AGE_MULT = 4.0;

// 心法 rate 是独立乘数，落在加法桶的地板夹取之外：
// 那个 0.1 地板保的是「加法修正堆到 −100% 也别归零」，而主动切心法是玩家自己的选择，
// 不该被那道保险托底
//
// 探索惩罚与长按运功同样是乘数、同样落在地板之外：它们都是玩家自己按下按钮换来的，
// 和心法一样属于「主动选择的代价」，不该被那道保险托底。
function cultivationRate(state) {
  const n = levelIndex(state.realm, state.sub);
  const spirit = findSpirit(state.spiritId);
  return baseRate(n) * spirit.mult * gongfaMult(state) * findStance(state.stanceId).rate
    * (state.boosting ? BOOST_RATE_MULT : 1)
    * Math.max(0.1, 1 + rateAdditive(state))
    * (isExploring(state) ? EXPEDITION_RATE_MULT : 1);
}

function lifespanCap(state) {
  const base = REALMS[state.realm].life;
  if (!Number.isFinite(base)) return Infinity;
  const g = GONGFA[state.gongfaId] ?? GONGFA.yinqi;
  const add = findSpirit(state.spiritId).lifeAdd
    + sumField(stateTalents(state), 'lifeAdd')
    + sumField(stateShentong(state), 'lifeAdd')
    + (g.lifeAdd ?? 0)
    + (state.upgrades?.guiling ?? 0) * 0.03;
  // 下限夹到 0。逆天改命 −0.30、雷劫之体 −0.25、焚天煮海诀 −0.35 再叠上几门减寿神通，
  // lifeAdd 合计可以低于 −1.0，寿限就成了负数，界面上出现「128 / −9 载」这种读不通的东西。
  // 夹到 0 之后语义是「即刻道消」：tick 里 age >= cap 立刻成立，这条烧命的路仍然必死——
  // 结局不变，变的只是它现在说得通。
  return Math.max(0, base * (1 + add));
}

// 修为溢出带来的突破加成：每额外攒满 1 倍当前层需求 +15%，封顶 +30%
function overflowBonus(state) {
  const need = req(levelIndex(state.realm, state.sub));
  const extra = Math.max(0, state.cultivation - need);
  return Math.min(0.30, Math.floor(extra / need) * 0.15);
}

// 心法不在这条公式里出现，也不该再出现：担着这一维的「抱元守一」已随 breakAdd 字段
// 一并删除（理由见 data/stances.js）。突破前的准备手段只剩溢出攒修为与固元丹两样，
// 它们都是「事先付出代价」，而切心法零成本零冷却——那正是必须把它请出这条公式的原因。
function breakthroughChance(state) {
  const g = GONGFA[state.gongfaId] ?? GONGFA.yinqi;
  const add = findSpirit(state.spiritId).breakAdd
    + sumField(stateTalents(state), 'breakAdd')
    + sumField(stateShentong(state), 'breakAdd')
    + (g.breakAdd ?? 0)
    + (state.upgrades?.tianxin ?? 0) * 0.02
    + (state.permanentBreakAdd ?? 0);
  // 固元丹的加成必须留在乘法之外、与 overflowBonus 同列相加，按百分点计——
  // 绝不能并进上面那个相对加成桶 add。并进去的话，渡劫基础率只有 15%，
  // +0.12 只换来 15% × 1.12 = 16.8%，也就是 +1.8 个百分点；而固元丹的设计定位
  // 恰恰是「为最难那一关攒钱」，结果在最需要它的境界最没用，期望收益比回气丹
  // 低两个数量级。按百分点算，+0.12 就是实打实的 +12pp（15% → 27%，接近翻倍）。
  // 以后如果有人想把它「顺手」挪回 add 桶，先把上面这组对比数字重新算一遍。
  const p = REALMS[state.realm].chance * (1 + add) + overflowBonus(state) + (state.pillBreakBonus ?? 0);
  return Math.min(0.95, Math.max(0.05, p));
}

// 机缘收益 / 劫难损失的加法修正
function fortuneModifier(state) {
  const g = GONGFA[state.gongfaId] ?? GONGFA.yinqi;
  return 1 + sumField(stateTalents(state), 'fortuneAdd')
    + sumField(stateShentong(state), 'fortuneAdd')
    + (g.fortuneAdd ?? 0);
}

// 事件间隔加法修正。心法自四选四改版起不再参与这一维——原来担着这个职责的
// 「静观天机」已删除，事件频率的表达全部收拢到天赋（气运之子等）、功法
// （大梦千秋、听潮引）、神通（缩地成寸、顺风耳）里，心法专注在修炼速率 / 突破率 / 寿元三维上。
function intervalModifier(state) {
  const g = GONGFA[state.gongfaId] ?? GONGFA.yinqi;
  const add = sumField(stateTalents(state), 'intervalAdd')
    + sumField(stateShentong(state), 'intervalAdd')
    + (g.intervalAdd ?? 0);
  return Math.max(0.2, 1 + add);
}

// 寿元消耗速度倍率。龟息功与心法相乘：两者都是「呼吸慢下来」的同一件事，
// 相加会让胎息 + 龟息越界为负（1 − 0.85 − 0.25 = −0.10），相乘才是 0.15 × 0.75 = 0.1125
//
// 长按运功同样相乘、同样是同一件事的反面（呼吸急起来）：胎息里运功是 0.15 × 4.0 = 0.6，
// 仍比平心静气省，这正是那个组合成立的地方。
function ageRate(state) {
  return (hasShentong(state, 'guixi') ? 0.75 : 1) * findStance(state.stanceId).age
    * (state.boosting ? BOOST_AGE_MULT : 1);
}

// 道消 / 飞升时结算的道韵
function daoyunGain(state) {
  const r = state.ascended ? 9 : state.realm;
  return Math.floor(Math.pow(r + 1, 2) * 5 + state.age / 100 + (state.eventsSeen ?? 0) * 0.2);
}


// ===== logic/state.js =====
const SAVE_VERSION = 1;
const SAVE_KEY = 'xiuxian-sim.save.v1';

// 按 weight 加权抽取灵根，并决定其属性
function rollSpirit(rnd) {
  const total = SPIRITS.reduce((a, s) => a + s.weight, 0);
  let roll = rnd() * total;
  let picked = SPIRITS[SPIRITS.length - 1];
  for (const s of SPIRITS) {
    if (roll < s.weight) { picked = s; break; }
    roll -= s.weight;
  }
  const pool = picked.mutant ? MUTANT_ELEMENTS : ELEMENTS;
  const elements = [];
  if (picked.mutant) {
    elements.push(pool[Math.floor(rnd() * pool.length) % pool.length]);
  } else {
    const shuffled = [...ELEMENTS];
    const start = Math.floor(rnd() * ELEMENTS.length) % ELEMENTS.length;
    for (let i = 0; i < picked.count; i++) elements.push(shuffled[(start + i) % ELEMENTS.length]);
  }
  return { spiritId: picked.id, elements };
}

// 抽 1~2 个天赋，30% 概率抽到 2 个，同局不重复
function rollTalents(rnd) {
  const count = rnd() < 0.3 ? 2 : 1;
  const pool = TALENTS.map((t) => t.id);
  const picked = [];
  for (let i = 0; i < count && pool.length > 0; i++) {
    const idx = Math.floor(rnd() * pool.length) % pool.length;
    picked.push(pool.splice(idx, 1)[0]);
  }
  return picked;
}

// upgrades / daoyun / lifetimeCount 跨世继承，由 actions.reincarnate 传入
function createState(rnd = Math.random, carry = {}) {
  const { spiritId, elements } = rollSpirit(rnd);
  return {
    version: SAVE_VERSION,
    daoHao: '无名散修',
    realm: 0,
    sub: 0,
    cultivation: 0,
    age: START_AGE,
    spiritId,
    elements,
    talentIds: rollTalents(rnd),
    gongfaId: 'yinqi',
    stanceId: 'pingxin',
    // 长按运功。纯粹的输入设备状态——手指按住时为真，松手即假，绝不进存档
    // （见 serialize / deserialize）。它与 stanceId 相乘而非替代，见 formulas.cultivationRate。
    boosting: false,
    shentongIds: [],
    debuffs: [],
    permanentBreakAdd: 0,
    // 灵材从练气就开始积累，炼丹到金丹才解锁——解锁那一刻手里已有存货
    lingcai: 0,
    // 固元丹的一次性突破加成。刻意做成层内状态：炼了就得用掉，用早了浪费
    pillBreakBonus: 0,
    // 秘境探索。null 表示人在山中打坐；在洞里时是
    //   { layer, remaining, total, awaiting, haul: { lingcai, shentongIds, gongfaId }, texts }
    // remaining 由 tick 每步递减（因此在线与离线自动一致），归零即由 resolveLayer 结算
    // 这一层并把 awaiting 置真，停在那里等玩家决定「再深一层」还是「就此出关」。
    // haul 是未落袋的收获——只有主动出关才写进 state，撞上险境全部损失。
    expedition: null,
    // 出关的结算。刻意与 expedition 分开存：险境强制出关可能发生在离线期间，而弹层
    // 必须等玩家回来才弹，所以结果得在 state 里等着，由 UI 取走（见 takeExpeditionResult）
    expeditionResult: null,
    luck: 0,
    eventsSeen: 0,
    recentEventIds: [],
    nextEventIn: 20,
    // 下一个事件在弹出之前就已抽好（见 tick.js 的 takeNextEvent），观星术读的就是它
    nextEventId: null,
    pendingEventId: null,
    dead: false,
    ascended: false,
    daoyunSettled: false,
    _acc: 0,
    lastSaveAt: 0,
    logLines: [],
    daoyun: carry.daoyun ?? 0,
    upgrades: carry.upgrades ?? { daoji: 0, tianxin: 0, guiling: 0 },
    lifetimeCount: carry.lifetimeCount ?? 1,
  };
}

// boosting 在写入侧就归零：存档是「世界的样子」，而「手指正按着按钮」不是世界的一部分。
// 自动存档每 5 秒一次，玩家按住运功时必定会撞上一次，写进去的就是一句谎话。
// 真正的保险在 deserialize 那一侧（读入侧才是唯一的收口，见那里的注释）。
function serialize(state) {
  return JSON.stringify({ ...state, boosting: false });
}

// 反序列化失败、版本不匹配、关键字段越界，一律返回 null，由调用方开新档。
//
// 字段校验是必需的而不是防御性冗余：formulas.js 的 lifespanCap / breakthroughChance
// 直接取 REALMS[state.realm]，realm 越界会抛 TypeError 白屏；而 age/cultivation 若为
// NaN，会顺着 daoyunGain 污染跨世继承的道韵（NaN 一旦存盘就永久传染）。
// 在这个边界上响亮地失败（开新档），好过让坏数据静默流进游戏。
function deserialize(json) {
  if (typeof json !== 'string' || json.length === 0) return null;
  let data;
  try {
    data = JSON.parse(json);
  } catch {
    return null;
  }
  if (!data || typeof data !== 'object') return null;
  if (data.version !== SAVE_VERSION) return null;
  if (!Number.isInteger(data.realm) || data.realm < 0 || data.realm >= REALMS.length) return null;
  if (!Number.isInteger(data.sub) || data.sub < 0 || data.sub > 3) return null;
  for (const key of ['cultivation', 'age', '_acc', 'daoyun']) {
    if (!Number.isFinite(data[key])) return null;
  }
  // 灵材与丹药加成是后加的字段，老存档里根本没有，缺席一律补 0 而不是整档作废。
  // 但只要写着值就必须是有限数：lingcai 每步都进 `+=`，一个 null 就让灵材永远是
  // NaN、炼丹面板整片灰掉；pillBreakBonus 直接进突破概率的加法桶，坏值会让
  // Math.min/max 夹取失效，冲关成功率算不出来。
  for (const key of ['lingcai', 'pillBreakBonus']) {
    if (data[key] === undefined) data[key] = 0;
    else if (!Number.isFinite(data[key])) return null;
  }
  // 长按运功绝不从存档恢复，无条件强制为 false——这一条是硬性的，不是防御性冗余。
  // 存着「正在运功」的档一旦重载，玩家会在没有任何人按住按钮的情况下按 ×4 烧寿元，
  // 而且 loadGame 紧接着就跑 applyOffline（走的是同一条 tick），离线那几小时会被
  // 一并按四倍结算，回来人就没了。写入侧已经归零，这里是读入侧的收口：它同时接住
  // 任何绕过 serialize 写出来的档（手改 localStorage、旧构建、将来某条忘了归零的路径）。
  data.boosting = false;
  // 秘境同样是后加的字段：老存档里没有，缺席一律补 null（人在山中打坐），不作废整档。
  if (data.expedition === undefined) data.expedition = null;
  if (data.expeditionResult === undefined) data.expeditionResult = null;
  // 三档预设时代（{ depthId, remaining, total }）的存档：那套语义已经整体不存在了，
  // 没有任何诚实的方式把它翻译成层数与行囊——凭空给个 layer 就是替玩家决定他在第几层，
  // 而层数直接定收益与险率。归零成「人在山中打坐」，玩家丢的是一趟没走完的探索，
  // 而不是一整世的进度。同理，读不出层数的旧结算也一并丢掉：少弹一个总结弹层，
  // 好过弹一个字段全是 undefined 的空框。
  if (isLegacyExpedition(data.expedition)) data.expedition = null;
  if (isLegacyResult(data.expeditionResult)) data.expeditionResult = null;
  // 剩下的必须是能推进、能结算的东西。坏值在这里放过去的后果不是崩，是静默烂档：
  // remaining 为 NaN 的探索永远不会归零，玩家的修炼速度就永久停在 0.4 倍、灵材永久
  // 断供，界面上那句「还需 NaN 载」也再不会变。层号越界则收益与险率无从取值。
  if (data.expedition !== null && !validExpedition(data.expedition)) return null;
  return data;
}

function isLegacyExpedition(e) {
  return !!e && typeof e === 'object' && e.depthId !== undefined && e.layer === undefined;
}

function isLegacyResult(r) {
  return !!r && typeof r === 'object' && r.layers === undefined;
}

// haul 缺席补空行囊（后加的字段照既有约定补默认值），但写着值就必须是有限数：
// lingcai 每层都进 `+=`，一个 null 就让未落袋的收获永远是 NaN，出关时把玩家的
// 灵材整个染成 NaN，丹房从此全片灰掉。
function validHaul(e) {
  if (e.haul === undefined || e.haul === null) { e.haul = { lingcai: 0, shentongIds: [], gongfaId: null }; return true; }
  if (typeof e.haul !== 'object') return false;
  if (!Number.isFinite(e.haul.lingcai)) return false;
  if (!Array.isArray(e.haul.shentongIds)) return false;
  return true;
}

function validExpedition(e) {
  if (!e || typeof e !== 'object') return false;
  if (!Number.isInteger(e.layer) || e.layer < 1 || e.layer > SECRET_MAX_LAYER) return false;
  if (!Number.isFinite(e.remaining) || !Number.isFinite(e.total) || e.total <= 0) return false;
  if (!Array.isArray(e.texts)) e.texts = [];
  e.awaiting = !!e.awaiting;
  return validHaul(e);
}


// ===== logic/tick.js =====
// 固定步长（游戏年）。任何 dt 都被拆成整数个 STEP + 存入 state._acc 的余数，
// 这是 tick(10) 与 10×tick(1) 结果一致的前提，改动前请先跑 tests/tick.test.mjs
const STEP = 0.1;

const OFFLINE_CAP_SECONDS = 8 * 3600;
const OFFLINE_EFFICIENCY = 0.6;

// 离线最多消耗剩余寿元的这个比例。见 applyOffline 中的注释，这个夹取是必须的
const OFFLINE_LIFE_SHARE = 0.5;

const EVENT_MIN = 25;
const EVENT_MAX = 45;

// 事件间隔随当前小层耗时缩放。小层耗时按 1.15^n 指数增长，间隔若固定，
// 渡劫一个境界就会塞进约 150 次弹窗，而练气只有 2 次——后期变成纯刷屏，
// 且每次弹窗都硬停时间，挂机游戏就挂不动了。按比例缩放后每个境界稳定在
// 10 次左右。EVENT_MIN 作为地板，保住前期原有的密度。
const EVENT_LEVEL_RATIO = 0.4;

// 0.1 在二进制浮点下并非精确值，反复 += / -= 会让余数系统性地"差一点点"落到 STEP
// 之下，导致本该发生的最后一步被吞掉（例如 acc 从 3 反复减 0.1 时，第 30 次减法前
// 余数是 0.09999999999999848，严格 >= 0.1 判负）。经验证：dt=0.3/2/3/4/20/50/1000
// 单次调用、以及跨调用累积都会踩到，且始终朝"少走一步"这一个方向系统性偏，不是
// 随机抖动——这正是本任务要杜绝的"系统性漂移"。加一个远小于 STEP、又远大于可观测
// 浮点噪声（实测上限量级 ~3e-8）的容差消掉这个边界误判。
const ACC_EPSILON = 1e-6;

// ===== 事件预抽 =====
//
// 观星术要在事件降临之前就说出「下一桩是机缘还是劫难」，所以下一个事件必须提前定下来，
// 而不是等倒计时归零时才现抽。state.nextEventId 就是这枚已经落定、还没揭晓的签。
//
// 去重记账的顺序问题（本次实现的关键取舍）：pickEvent 靠 state.recentEventIds 避开最近
// RECENT_WINDOW 条，而这个窗口是 resolveEvent（玩家做完选择）时才追加当前事件的。预抽
// 却发生在「事件刚弹出、玩家还没选」的时刻——此刻窗口里还没有刚弹出的那一条，直接预抽
// 会让同一个事件有几率连着出现两次，去重窗口凭空少一格。
//
// 选择：预抽时把刚弹出的事件并进窗口的一份副本再抽，不写回 state（写回就会与
// resolveEvent 的追加重复记账，把窗口挤掉一格，效果同样是错的）。这份副本与
// resolveEvent 之后的 recentEventIds 逐字相同，因此「任意连续 9 条事件互不相同」
// 这条不变量与预抽之前完全一致。
//
// 另一条路是把预抽挪进 resolveEvent、等窗口更新完再抽。它同样正确，但事件的产生会散到
// 两个模块（首个事件、调试面板仍得在别处现抽），且死亡/转世路径上 resolveEvent 未必被
// 调到。抽签这件事留在 tick 一处更好收口。
//
// 预抽固有的一处代价：pickEvent 的机缘权重里含气运（每点 +0.2），而这一签在玩家做出
// 本次选择之前就已落定，所以本次选择挣到的气运要到再下一桩才生效，比原来晚一桩。
// 这是「提前知道下一桩」换来的——签既然要提前给人看，就不能再受后来的事影响。
function rollNextEvent(state, rng, justFired = null) {
  const recent = state.recentEventIds ?? [];
  const dedupWindow = justFired === null ? recent : [...recent, justFired].slice(-RECENT_WINDOW);
  return pickEvent({ ...state, recentEventIds: dedupWindow }, rng);
}

// 预抽只在当前境界的事件池内有效。玩家在两次事件之间突破跨池时，早年的机缘不该追到
// 化神修士头上——这是预抽之前就成立的约束（pickEvent 一直按当前境界取池）。
// 作废后立刻重抽，观星术的预告也随之更新，不会停在旧池上骗人。
function upcomingEvent(state) {
  const e = findEvent(state.nextEventId ?? null);
  return e && e.pool === poolFor(state.realm) ? e : null;
}

// 取出预抽好的事件作为这次弹出的事件，并补上下一次的预抽。
// 没有可用预抽（新档、老存档、跨池作废）时现抽，与预抽引入之前的行为完全一致。
function takeNextEvent(state, rng = Math.random) {
  const ready = upcomingEvent(state);
  const fired = ready ? ready.id : pickEvent(state, rng);
  state.nextEventId = rollNextEvent(state, rng, fired);
  return fired;
}

function advanceOneStep(state, opts) {
  state.age += STEP * ageRate(state);
  state.cultivation += cultivationRate(state) * STEP;
  // 灵材与修为一样按步累加，因此在线与离线自动一致（离线走的是同一条 tick）。
  // `?? 0` 是给老存档留的门：它们的 lingcai 由 deserialize 补成 0，这里再兜一次，
  // 免得任何一条没走存档的路径（调试面板直改 state）把它变成 NaN
  //
  // 探层期间断供：灵材改由秘境逐层产出。两头都拿的话，深入的收益就不是
  // 「换来的」而是「白捡的」，那个 ×0.4 的修炼惩罚也就再压不住任何抉择。
  // 等待决定期间不算在探（isExploring 为假），被动积累照常——理由见 formulas.isExploring。
  if (!isExploring(state)) {
    state.lingcai = (state.lingcai ?? 0) + lingcaiRate(state) * STEP;
  }

  // 小层晋升，溢出结转；圆满层不自动突破
  while (state.sub < 3 && state.cultivation >= req(levelIndex(state.realm, state.sub))) {
    state.cultivation -= req(levelIndex(state.realm, state.sub));
    state.sub += 1;
  }

  for (const d of state.debuffs) d.remaining -= STEP;
  if (state.debuffs.some((d) => d.remaining <= 0)) {
    state.debuffs = state.debuffs.filter((d) => d.remaining > 0);
  }

  // 层进度必须在这里推进，而不是在 UI 的每帧循环里：这样在线与离线自动一致
  // （离线走的是同一条 tick），玩家关掉标签页那几个小时里，洞里的人照样在往下走。
  //
  // 关键的一条：resolveLayer 探完一层就停在「等待决定」，绝不自己往下钻。于是离线
  // 期间层进度正常推进、推完一层就停住，玩家回来看到的是「已探到第 3 层，请决定」，
  // 而不是替他连赌了七把的结果。等待决定期间 isExploring 为假，这个分支自然不再进——
  // 停手这件事不需要额外的开关，它就是同一个判据的另一面。
  //
  // 放在沉疴衰减之后：险境染上的那一条应当拿到完整时长，不该在同一步里先被扣掉 0.1。
  if (isExploring(state)) {
    state.expedition.remaining -= STEP;
    if (state.expedition.remaining <= 0) resolveLayer(state, opts.rng);
  }

  // 事件倒计时只在在线时推进——机缘必须由玩家亲自抉择
  if (!opts.offline) {
    // 预抽缺失（新档、老存档）或已跨池作废时补一签，让观星术随时有得可看
    if (!upcomingEvent(state)) state.nextEventId = rollNextEvent(state, opts.rng);
    state.nextEventIn -= STEP;
    if (state.nextEventIn <= 0) {
      state.pendingEventId = takeNextEvent(state, opts.rng);
      const base = Math.max(EVENT_MIN, levelSeconds(levelIndex(state.realm, state.sub)) * EVENT_LEVEL_RATIO);
      const span = base + opts.rng() * (EVENT_MAX - EVENT_MIN);
      state.nextEventIn = span * intervalModifier(state);
    }
  }

  if (state.age >= lifespanCap(state)) state.dead = true;
}

// 唯一的时间推进入口。dt 单位为现实秒（= 游戏年）
function tick(state, dt, opts = {}) {
  const options = { offline: false, rng: Math.random, ...opts };
  if (state.dead || state.ascended || state.realm >= ASCEND_REALM) return;

  // 有待抉择的事件时时间完全冻结，连累加器都不进——否则弹窗挂着的这段现实时间
  // 会堆进 _acc，玩家一点选项就瞬间跳过几十年
  if (state.pendingEventId) return;

  state._acc += dt;
  while (state._acc >= STEP - ACC_EPSILON) {
    advanceOneStep(state, options);
    state._acc -= STEP;
    if (state.dead) { state._acc = 0; return; }
    if (state.pendingEventId) return;
  }
}

// 离线结算：封顶 8 小时、按 60% 效率折算，走与在线完全相同的 tick
function applyOffline(state, elapsedSeconds) {
  const cappedSeconds = Math.min(Math.max(0, elapsedSeconds), OFFLINE_CAP_SECONDS);
  const ageBefore = state.age;
  const cultBefore = state.cultivation;
  const realmBefore = state.realm;
  const subBefore = state.sub;

  // 闭关不会闭死人。在 1 秒 = 1 游戏年的尺度下，练气期寿元余量约 104 年 ≈ 104 秒，
  // 不夹取的话玩家关掉标签页 3 分钟回来就是死的——挂机游戏惩罚挂机，前提就崩了。
  // 夹取到剩余寿元的一半后，长期挂机只会渐近逼近寿限、永不触及；而「寿元见底时
  // 要不要赌这一把突破」的压力完整留在在线玩法里。死亡应当来自玩家的抉择，
  // 而不是来自他关掉了标签页。
  const wanted = cappedSeconds * OFFLINE_EFFICIENCY;
  const headroom = Math.max(0, lifespanCap(state) - state.age);
  const allowed = (headroom * OFFLINE_LIFE_SHARE) / ageRate(state);
  const granted = Math.min(wanted, allowed);

  tick(state, granted, { offline: true });

  return {
    cappedSeconds,
    years: state.age - ageBefore,
    cultivationGained: state.cultivation - cultBefore,
    levelsGained: levelIndex(state.realm, state.sub) - levelIndex(realmBefore, subBefore),
    truncated: granted < wanted - 1e-9,
    died: state.dead,
  };
}


// ===== logic/persist.js =====
// 不能只写 typeof：在不透明源（某些 file:// 场景）、隐私模式、或企业策略禁用存储时，
// 访问 localStorage 属性本身就会抛 SecurityError，而 typeof 挡不住会抛的 getter。
// 存储不可用时降级成「能玩但不存档」，好过让 boot() 崩掉、整页只剩静态骨架——
// 这个游戏的交付前提就是双击 dist/index.html 就能玩。
function defaultStorage() {
  try {
    return typeof localStorage !== 'undefined' ? localStorage : null;
  } catch {
    return null;
  }
}

function saveGame(state, storage = defaultStorage(), now = Date.now()) {
  if (!storage) return false;
  state.lastSaveAt = now;
  try {
    storage.setItem(SAVE_KEY, serialize(state));
    return true;
  } catch {
    return false;
  }
}

// 返回 { state, offline } 或 null（无存档 / 存档损坏 / 版本不符）
function loadGame(storage = defaultStorage(), now = Date.now()) {
  if (!storage) return null;
  let raw;
  try {
    raw = storage.getItem(SAVE_KEY);
  } catch {
    return null;
  }
  const state = deserialize(raw);
  if (!state) return null;

  // 时钟回拨时按 0 处理，避免负收益
  const elapsed = Math.max(0, (now - (state.lastSaveAt ?? now)) / 1000);
  const offline = applyOffline(state, elapsed);
  return { state, offline };
}

function clearSave(storage = defaultStorage()) {
  if (storage) storage.removeItem(SAVE_KEY);
}


// ===== logic/actions.js =====
const FAIL_KEEP = 0.40;
const FAIL_KEEP_GUIYUAN = 0.70;
const FAIL_LIFE_COST = 0.08;
const DAOJI_DURATION = 0.05; // 当前境界寿元上限的 5%

function canBreakthrough(state) {
  if (state.dead || state.ascended) return false;
  if (state.realm >= ASCEND_REALM) return false;
  if (state.sub !== 3) return false;
  return state.cultivation >= req(levelIndex(state.realm, 3));
}

function attemptBreakthrough(state, rnd = Math.random) {
  if (!canBreakthrough(state)) return { attempted: false };

  const chance = breakthroughChance(state);
  const success = rnd() < chance;
  const fromRealm = state.realm;

  // 固元丹的药力只保这一把，成败之后一并散尽——必须在 chance 算完之后、
  // 且在两条返回路径之前清。放进 if 分支里就会漏掉失败那一路，
  // 玩家一次炼丹买到无限次加成
  state.pillBreakBonus = 0;

  if (success) {
    state.realm += 1;
    state.sub = 0;
    state.cultivation = 0;
    if (state.realm >= ASCEND_REALM) state.ascended = true;
    return { attempted: true, success: true, chance, fromRealm, toRealm: state.realm };
  }

  const keep = hasShentong(state, 'guiyuan') ? FAIL_KEEP_GUIYUAN : FAIL_KEEP;
  state.cultivation = req(levelIndex(state.realm, 3)) * keep;

  const lifeCost = REALMS[fromRealm].life * FAIL_LIFE_COST * (hasShentong(state, 'wulei') ? 0.5 : 1);
  state.age += lifeCost;

  if (!hasShentong(state, 'mingxin')) {
    const duration = REALMS[fromRealm].life * DAOJI_DURATION;
    const existing = state.debuffs.find((d) => d.id === 'daoji');
    if (existing) existing.remaining += duration;
    else state.debuffs.push({ id: 'daoji', name: '道基受损', remaining: duration });
  }

  if (state.age >= lifespanCap(state)) state.dead = true;

  return { attempted: true, success: false, chance, fromRealm, lifeCost, died: state.dead };
}

// ===== 炼丹 =====

function canBrew(state, pillId) {
  if (state.dead || state.ascended) return false;
  if (state.realm < PILL_UNLOCK_REALM) return false;
  const pill = findPill(pillId);
  if (!pill) return false;
  return (state.lingcai ?? 0) >= pill.cost;
}

// 炼一炉丹并当场服下。无失败率——见 data/pills.js 顶部，抉择在「灵材花在哪」，
// 不在「炼不炼得成」。效果全部读 PILLS 的声明式字段，加一味丹药不必回来改这里。
//
// 返回 { ok, pill, applied }：applied 是可直接拼进编年史的短语，
// 与 resolveEvent 的返回同形，main.js 两处共用一套写日志的写法。
function brewPill(state, pillId) {
  const pill = findPill(pillId);
  if (!canBrew(state, pillId)) return { ok: false, pill, applied: [] };

  state.lingcai -= pill.cost;
  const applied = [];

  if (pill.levels) {
    // 与事件的 cultivation 效果同一套语义：按当前层所需修为的倍数结算。
    // 溢出不清零，攒过头的部分照样进 overflowBonus——这是刻意的，
    // 「冲关前再补一颗回气丹」本就该换来更稳的一把
    state.cultivation += req(levelIndex(state.realm, state.sub)) * pill.levels;
    applied.push(`修为精进 ${pill.levels} 层`);
  }

  if (pill.cleanse) {
    const count = state.debuffs.length;
    state.debuffs = [];
    // 身上本来就干净时不许谎报战功：这一炉确实白炼了，编年史得照实记
    applied.push(count > 0 ? `涤去沉疴 ${count} 种` : '本无沉疴，白炼一炉');
  }

  if (pill.breakAdd) {
    // 累加而非覆盖：临关前连炼两颗是一个正经的选择（32 枚灵材 = 八个小层的积累），
    // 而突破概率本就被夹在 0.95，堆不出必成
    state.pillBreakBonus = (state.pillBreakBonus ?? 0) + pill.breakAdd;
    applied.push(`下次冲关胜算 +${Math.round(pill.breakAdd * 100)}%`);
  }

  if (pill.lifeShare) {
    // 增寿 = 当前境界寿元上限的比例，再折成年龄减少（与事件的 life 效果同向）。
    // 取 lifespanCap 而非 REALMS[realm].life：玩家自己的功法灵根已经改过上限，
    // 丹药该按他实际能活到的岁数发钱
    const years = lifespanCap(state) * pill.lifeShare;
    state.age = Math.max(0, state.age - years);
    applied.push(`增寿 ${Math.round(years)} 载`);
  }

  return { ok: true, pill, applied };
}

// 去重窗口：最近这么多条事件不再重复。tick.js 的事件预抽也要按同一个窗口记账，
// 所以这个数必须只有一份——两处各写一个 8，改一处忘一处就是静默的重复弹窗。
const RECENT_WINDOW = 8;
const DUP_SHENTONG_COMPENSATION = 0.3; // 重复神通折算为 0.3 层修为

// 结算玩家对事件的选择。optionIndex 为所选选项下标
function resolveEvent(state, event, optionIndex, rnd = Math.random) {
  if (!event) return { applied: [] };
  const option = event.options[optionIndex];
  if (!option) return { applied: [] };

  const mod = fortuneModifier(state);
  const need = req(levelIndex(state.realm, state.sub));
  const applied = [];

  for (const f of option.effects) {
    if (f.chance !== undefined && rnd() >= f.chance) continue;

    switch (f.kind) {
      case 'cultivation':
        state.cultivation = Math.max(0, state.cultivation + need * f.levels * mod);
        applied.push(f.levels > 0 ? '修为精进' : '修为折损');
        break;
      case 'life':
        // years 为正表示增寿（年龄减少），为负表示折寿（年龄增加）
        state.age -= f.years * mod;
        applied.push(f.years > 0 ? '寿元增益' : '折损阳寿');
        break;
      case 'breakAdd':
        state.permanentBreakAdd = (state.permanentBreakAdd ?? 0) + f.value;
        applied.push(f.value > 0 ? '道心通明' : '道心蒙尘');
        break;
      case 'debuff': {
        const existing = state.debuffs.find((d) => d.id === f.id);
        if (existing) existing.remaining += f.years;
        else state.debuffs.push({ id: f.id, name: f.name, remaining: f.years });
        applied.push(`染上${f.name}`);
        break;
      }
      case 'cureDebuff':
        state.debuffs = state.debuffs.filter((d) => d.id !== f.id);
        applied.push('沉疴尽去');
        break;
      case 'gongfa': {
        const art = GONGFA[f.id];
        state.gongfaId = f.id;
        applied.push(art ? `改修《${art.name}》` : '易主修功法');
        break;
      }
      case 'shentong': {
        const power = SHENTONG.find((x) => x.id === f.id);
        if (state.shentongIds.includes(f.id)) {
          state.cultivation += need * DUP_SHENTONG_COMPENSATION;
          applied.push('故技重温，聊补修为');
        } else {
          state.shentongIds.push(f.id);
          applied.push(power ? `习得「${power.name}」` : '习得神通');
        }
        break;
      }
      case 'luck':
        state.luck = (state.luck ?? 0) + f.value;
        applied.push(f.value > 0 ? '气运加身' : '气运折损');
        break;
      default:
        break;
    }
  }

  state.age = Math.max(0, state.age);
  state.pendingEventId = null;
  state.eventsSeen = (state.eventsSeen ?? 0) + 1;
  // 去重窗口在这里、也只在这里追加。tick.js 的预抽发生在本次追加之前（事件刚弹出、
  // 玩家还没选），它自己拿一份并入 event.id 的窗口副本去抽，不写回 state——
  // 两边都写就会把窗口挤掉一格。理由详见 tick.js 的 rollNextEvent。
  state.recentEventIds = [...(state.recentEventIds ?? []), event.id].slice(-RECENT_WINDOW);
  if (state.age >= lifespanCap(state)) state.dead = true;

  return { applied };
}

// ===== 秘境探索：逐层深入，见好就收 =====
//
// 与事件正好相反的一套时间语义：事件冻结时间等玩家选择，秘境让时间照走。层进度在 tick
// 里自己推进（因此离线也照样走），一层走完 tick 调 resolveLayer——而 resolveLayer 只做
// 一件事：把这一层的账算清，然后停下来等玩家决定。
//
// 三条不变量贯穿这一节，改动前先读懂：
//
//  1. 收获只有主动出关才落袋。探到的灵材、神通、功法全部先记在 expedition.haul 里，
//     withdrawExpedition 才真正写进 state。这是整个设计的支点：撞上险境时 haul 全灭，
//     「再深一层」才有真正的赌注，而不只是「再等一会儿」。
//  2. 等待决定期间不算在探（见 formulas.isExploring）。不设超时、不自动出关，
//     所以停留必须零代价，否则挂机玩家一离开就在慢性罚款。
//  3. 玩家不在线时绝不替他做决定。resolveLayer 里没有任何一条分支依赖「玩家在不在线」，
//     离线与在线算出的是同一个结果，而它到「等待决定」就停手。

function canExplore(state) {
  if (state.dead || state.ascended) return false;
  if (state.realm >= ASCEND_REALM) return false;
  if (state.realm < SECRET_UNLOCK_REALM) return false;
  // 判据是 inSecretRealm 而不是 isExploring：等待决定时人还在洞里，不许再入一趟
  if (inSecretRealm(state)) return false;
  // 有待抉择的事件时不许入：那会让两个弹层打架，而且事件正冻结着时间，
  // 层进度根本走不动，玩家只会看到一个卡住的倒计时
  if (state.pendingEventId) return false;
  return true;
}

// 空的行囊。单独一个函数是因为 startExpedition 与存档补默认值两处都要用同一个形状
function emptyHaul() {
  return { lingcai: 0, shentongIds: [], gongfaId: null };
}

// 入秘境，直接开始第一层
function startExpedition(state) {
  if (!canExplore(state)) return { ok: false };
  const total = layerYears(state);
  state.expedition = {
    layer: 1, remaining: total, total, awaiting: false, haul: emptyHaul(), texts: [],
  };
  return { ok: true, layer: 1, total };
}

// 一层探完的结算。由 tick 在 remaining 归零时调用。
//
// rnd 的调用次序是固定的（神通门槛 →（过则）神通抽取 → 功法门槛 →（过则）功法抽取
// → 险境门槛 →（过则）沉疴抽取 → 白描抽取），这是 tick 分片一致性
// （tick(10) == 10×tick(1)）的前提之一：同一颗种子在两条推进路径上必须消耗同样多、
// 同样序的随机数。门槛照样掷一次再判负，就是为了保住这个次序。
//
// 白描的抽签刻意排在最后一位：它是装饰，不该占住前面的位置，让「灵材/掉落/险境」
// 这三件正事的打点位置随文案的增删而漂移（测试里那些 rolls(...) 会一起烂掉）。
//
// 灵材不掷骰：secretLayer(n).lingcai 是定额 4+3n。押注的随机性全部集中在险境那一掷上，
// 收益端确定、风险端随机，玩家才算得清「再深一层」值不值——收益也随机的话，
// 那张停手表（见 data/secrets.js）就没法给玩家一个可推理的最优解了。
function resolveLayer(state, rnd = Math.random) {
  const e = state.expedition;
  if (!e || e.awaiting) return null;
  const spec = secretLayer(e.layer);
  // 层号越界只会来自被改坏的存档。清掉整趟而不是兜底某一层：兜底就是替玩家凭空
  // 决定他在第几层，而层数直接定收益与险率
  if (!spec) { state.expedition = null; return null; }

  const haul = e.haul;
  haul.lingcai += spec.lingcai;

  if (rnd() < spec.shentongChance) {
    const pool = secretShentongPool(state.realm);
    const id = pool[Math.floor(rnd() * pool.length) % pool.length];
    const power = SHENTONG.find((s) => s.id === id);
    // 已在身上的、以及这趟已经拾到的，都算重复：同一门神通不该在行囊里躺两份
    const held = state.shentongIds.includes(id) || haul.shentongIds.includes(id);
    if (held) haul.lingcai += SECRET_DUP_LINGCAI;
    else if (power) haul.shentongIds.push(id);
  }

  if (rnd() < spec.gongfaChance) {
    const pool = secretGongfaPool(state.realm);
    const id = pool[Math.floor(rnd() * pool.length) % pool.length];
    const art = GONGFA[id];
    // 比较对象是「出关后真正会用的那一门」：行囊里已有更好的残卷时，对照那一卷
    const current = haul.gongfaId ?? state.gongfaId;
    if (art && betterGongfa(current, id)) haul.gongfaId = id;
    else if (art) haul.lingcai += SECRET_DUP_LINGCAI; // 不如己有的折成灵材，理由见 secrets.betterGongfa
  }

  let risk = null;
  if (rnd() < spec.riskChance) {
    const years = REALMS[state.realm].life * spec.lifeCostRatio;
    state.age += years;
    const id = SECRET_DEBUFF_IDS[Math.floor(rnd() * SECRET_DEBUFF_IDS.length) % SECRET_DEBUFF_IDS.length];
    const def = DEBUFFS[id];
    const duration = REALMS[state.realm].life * SECRET_DEBUFF_RATIO;
    const existing = state.debuffs.find((d) => d.id === id);
    if (existing) existing.remaining += duration;
    else state.debuffs.push({ id, name: def.name, remaining: duration });
    risk = { layer: e.layer, years, debuffId: id, debuffName: def.name };
  }

  e.texts.push(pickLayerText(e.layer, rnd));

  // 险境 = 强制出关，且未落袋的收获全部损失。折寿与沉疴照样落在身上——
  // 代价是真的，只有收获是假的，这才是「见好就收」四个字的全部重量
  if (risk) return forcedExit(state, risk);

  e.awaiting = true;
  // 夹到 0 而不是留个负数：进度条要走满，界面上也不该出现「还需 −0 载」
  e.remaining = 0;
  return { layer: e.layer, awaiting: true, risk: null, haul, text: e.texts[e.texts.length - 1] };
}

// 险境强制出关。haul 一枚不落地散尽，结算搁进 state.expeditionResult 等 UI 取。
function forcedExit(state, risk) {
  const e = state.expedition;
  const lost = e.haul;
  const applied = [
    `探至第 ${e.layer} 层，撞上未散的凶煞`,
    `折寿 ${Math.round(risk.years)} 载，染上${risk.debuffName}`,
  ];
  const dropped = [];
  if (lost.lingcai > 0) dropped.push(`灵材 ${lost.lingcai} 枚`);
  if (lost.shentongIds.length > 0) dropped.push(`神通残篇 ${lost.shentongIds.length} 卷`);
  if (lost.gongfaId) dropped.push('一卷功法');
  applied.push(dropped.length > 0 ? `${dropped.join('、')}尽数散落，一件也没带出来` : '本就空手，无可再失');

  state.expeditionResult = {
    layers: e.layer, banked: false, lingcai: 0,
    shentongIds: [], gongfaId: null,
    lost: { lingcai: lost.lingcai, shentongIds: [...lost.shentongIds], gongfaId: lost.gongfaId },
    risk, texts: [...e.texts], applied,
  };
  state.expedition = null;
  if (state.age >= lifespanCap(state)) state.dead = true;
  return state.expeditionResult;
}

// 「再深一层」。第 7 层之后无路可走
function canDescend(state) {
  const e = state.expedition;
  if (!e || !e.awaiting) return false;
  if (state.dead || state.ascended) return false;
  return e.layer < SECRET_MAX_LAYER;
}

// 下一层的路程在踏进去的这一刻现算。玩家可能在洞里突破了境界（探层期间修为照涨，
// 只是慢），此后每一层都按新境界的尺度算——已经走完的层不追溯，正在走的层不改。
function descendLayer(state) {
  if (!canDescend(state)) return { ok: false };
  const e = state.expedition;
  e.layer += 1;
  e.awaiting = false;
  e.total = layerYears(state);
  e.remaining = e.total;
  return { ok: true, layer: e.layer, total: e.total };
}

// 「就此出关」——落袋的唯一一条路。
//
// 神通与功法在这里再判一次重复/降级，不是冗余：探层期间事件照常降临，玩家完全可能
// 在秘境里靠一桩机缘学到同一门神通、或换到更好的功法，此时行囊里那一卷就从「升级」
// 变成了「暗刀」。拾取时判过的那一次管的是行囊内部不重复，管不到这段时间里 state
// 自己的变化。
function withdrawExpedition(state) {
  const e = state.expedition;
  if (!e || !e.awaiting) return null;
  if (state.dead || state.ascended) return null;

  const haul = e.haul;
  let lingcai = haul.lingcai;
  const learned = [];
  let gongfaId = null;
  const applied = [];

  for (const id of haul.shentongIds) {
    const power = SHENTONG.find((s) => s.id === id);
    if (!power) continue;
    if (state.shentongIds.includes(id)) {
      lingcai += SECRET_DUP_LINGCAI;
      applied.push(`「${power.name}」已在身上，折灵材 ${SECRET_DUP_LINGCAI} 枚`);
    } else {
      state.shentongIds.push(id);
      learned.push(id);
      applied.push(`习得「${power.name}」`);
    }
  }

  if (haul.gongfaId) {
    const art = GONGFA[haul.gongfaId];
    if (art && betterGongfa(state.gongfaId, haul.gongfaId)) {
      gongfaId = haul.gongfaId;
      state.gongfaId = haul.gongfaId;
      applied.push(`改修《${art.name}》`);
    } else if (art) {
      lingcai += SECRET_DUP_LINGCAI;
      applied.push(`残卷不及己有，折灵材 ${SECRET_DUP_LINGCAI} 枚`);
    }
  }

  state.lingcai = (state.lingcai ?? 0) + lingcai;
  applied.unshift(`得灵材 ${lingcai} 枚`);
  applied.unshift(`探至第 ${e.layer} 层，安然出关`);

  state.expeditionResult = {
    layers: e.layer, banked: true, lingcai,
    shentongIds: learned, gongfaId,
    lost: null, risk: null, texts: [...e.texts], applied,
  };
  state.expedition = null;
  return state.expeditionResult;
}

// UI 取走待展示的结算并清空。只有取走这一条路会清空它：险境强制出关可能发生在玩家
// 离线时，结果就得一直在存档里等着，直到他回来亲眼看见
function takeExpeditionResult(state) {
  const result = state.expeditionResult ?? null;
  state.expeditionResult = null;
  return result;
}

const UPGRADES = {
  daoji:   { name: '道基深厚', desc: '修炼速度 +5%',       max: 20, unit: 10 },
  tianxin: { name: '天心通明', desc: '突破成功率加成 +2%', max: 10, unit: 25 },
  guiling: { name: '龟龄鹤算', desc: '寿元上限 +3%',       max: 15, unit: 20 },
};

// 第 level+1 级（即从 level 升到 level+1）的道韵成本
function upgradeCost(key, level) {
  return UPGRADES[key].unit * (level + 1);
}

function buyUpgrade(state, key) {
  const def = UPGRADES[key];
  if (!def) return false;
  const level = state.upgrades[key] ?? 0;
  if (level >= def.max) return false;
  const cost = upgradeCost(key, level);
  if ((state.daoyun ?? 0) < cost) return false;
  state.daoyun -= cost;
  state.upgrades[key] = level + 1;
  return true;
}

// 道消或飞升后开启新的一世：结算道韵，继承永久加成，重抽灵根与天赋
function reincarnate(state, rnd = Math.random) {
  return createState(rnd, {
    daoyun: (state.daoyun ?? 0) + daoyunGain(state),
    upgrades: { ...state.upgrades },
    lifetimeCount: (state.lifetimeCount ?? 1) + 1,
  });
}


// ===== view/log.js =====
const MAX_LOG_LINES = 200;

function pushLog(state, text) {
  // 增寿的机缘会让 age 减少，若直接按当时年龄盖戳，编年史会出现「120载 → 119载」
  // 这种时光倒流。取历史最大值，保证记事按时间单调推进。
  const last = state.logLines.length > 0 ? state.logLines[state.logLines.length - 1].age : 0;
  state.logLines.push({ age: Math.max(last, Math.floor(state.age)), text });
  if (state.logLines.length > MAX_LOG_LINES) {
    state.logLines.splice(0, state.logLines.length - MAX_LOG_LINES);
  }
}

function renderLog(state, el) {
  if (!el) return;
  el.innerHTML = state.logLines
    .slice(-60)
    .map((l) => `<div class="log-line"><span class="log-age">${l.age}载</span>${l.text}</div>`)
    .join('');
  el.scrollTop = el.scrollHeight;
}


// ===== view/modal.js =====
let currentClose = null;

function openModal({ title, body, actions }) {
  closeModal();
  const root = document.getElementById('modal-root');
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `
    <div class="modal">
      <div class="modal-title">${title}</div>
      <div class="modal-body">${body}</div>
      <div class="modal-actions"></div>
    </div>`;
  const actionBox = mask.querySelector('.modal-actions');
  actions.forEach((a, i) => {
    const btn = document.createElement('button');
    btn.className = 'modal-btn';
    btn.textContent = a.label;
    btn.addEventListener('click', () => { closeModal(); a.onClick(i); });
    actionBox.appendChild(btn);
  });
  root.appendChild(mask);
  currentClose = () => mask.remove();
}

function closeModal() {
  if (currentClose) { currentClose(); currentClose = null; }
}

function isModalOpen() {
  return currentClose !== null;
}


// ===== view/render.js =====
const $ = (id) => document.getElementById(id);

// 后期单层修为需求上亿（req(35) ≈ 4.6e8），原样打印会把数字撑出圆环，
// 所以按中文习惯折成万 / 亿。一万以下保持精确，前期玩家仍能看清每一点进度。
// 千万量级砍掉小数位：最宽的一行「1198万 / 1377万」才留得住环内两侧的余量。
function formatCult(n) {
  const v = Math.floor(n);
  const a = Math.abs(v);
  if (a < 1e4) return String(v);
  if (a < 1e7) return `${(v / 1e4).toFixed(1)}万`;
  if (a < 1e8) return `${(v / 1e4).toFixed(0)}万`;
  return `${(v / 1e8).toFixed(2)}亿`;
}

// 速率前期要看清小数（8.3 修为/载），后期同样得折算，否则是 67688.1 这种读不动的数
function formatRate(n) {
  return Math.abs(n) < 1e4 ? n.toFixed(1) : formatCult(n);
}

// 没有「神识内视」时只给模糊描述，把信息本身做成奖励
function chanceLabel(state) {
  const p = breakthroughChance(state);
  if (hasShentong(state, 'neishi')) return `成功率 ${(p * 100).toFixed(1)}%`;
  if (p >= 0.8) return '十拿九稳';
  if (p >= 0.6) return '似有七分把握';
  if (p >= 0.4) return '成败各半';
  if (p >= 0.2) return '凶多吉少';
  return '九死一生';
}

// 按钮上的数值全部由 STANCES 现算，不另存一份展示文案——否则调了数值忘了改文案，
// 玩家读到的取舍就是假的。手机上没有 hover，关键数字必须直接印在按钮上，
// title 只作桌面端的补充。
function stanceStats(s) {
  const parts = [];
  if (s.rate !== 1) parts.push(`速×${s.rate}`);
  if (s.age !== 1) parts.push(`寿耗×${s.age}`);
  return parts.length > 0 ? parts : ['无偏无倚'];
}

// 长按运功的标注。同样由常量现算，不另存一份展示文案——这两个数字是玩家决定
// 「值不值得按下去」的全部依据，写死在 HTML 里迟早与 formulas.js 对不上。
function boostStats() {
  return [`速×${BOOST_RATE_MULT}`, `寿耗×${BOOST_AGE_MULT}`];
}

// ===== 丹房 =====
//
// 走 stanceStats 的同一套写法：标注由 PILLS 的声明式字段现算，不另存一份展示文案。
// 延寿丹是这里唯一需要 state 的一味——「增寿 6%」要玩家自己去查当前境界的寿元上限
// 再做一次乘法，而炼与不炼恰恰取决于那个绝对年数（金丹 36 载，渡劫 1320 载）。
// 数字既然是决定的依据，就该直接印在按钮上。
function pillStats(pill, state) {
  const parts = [];
  if (pill.levels) parts.push(`修为+${pill.levels}层`);
  if (pill.cleanse) parts.push('尽去沉疴');
  if (pill.breakAdd) parts.push(`下次破+${Math.round(pill.breakAdd * 100)}%`);
  if (pill.lifeShare) {
    const cap = lifespanCap(state);
    parts.push(Number.isFinite(cap) ? `增寿${Math.round(cap * pill.lifeShare)}载`
      : `增寿${Math.round(pill.lifeShare * 100)}%`);
  }
  return parts;
}

// 与 renderStances 同理：按钮只建一次，之后每帧仅切换可用态。
// 每帧重设 innerHTML 会让手指按住时的高亮被反复打断，点击也可能落在被替换掉的节点上。
// 行本身就是按钮（而非行内再套一个小按钮）：手机上整条 44px 高的横条都是触摸目标。
function renderPills(state) {
  const panel = $('pill-panel');
  const unlocked = state.realm >= PILL_UNLOCK_REALM;
  panel.hidden = !unlocked;
  if (!unlocked) return;

  const rows = $('pill-rows');
  const list = Object.values(PILLS);
  // 重建的判据不能只是「按钮数目对不对」：延寿丹标的是绝对年数，寿元上限一变
  // （突破进新境界、换功法、习得伏魔金钟）那个数就过期了。把标注真正依赖的东西
  // 编成一枚指纹，变了才重建——寿限一局里只变个位数次，不会与每帧重绘沾边。
  const stamp = `${list.length}|${Math.round(lifespanCap(state))}`;
  if (rows.dataset.stamp !== stamp) {
    rows.dataset.stamp = stamp;
    // aria-label 显式给全，否则读屏念出来的是那句 desc，丹药叫什么、要花多少反而丢了
    rows.innerHTML = list.map((p) => `<button type="button" class="pill-btn" data-pill="${p.id}"
        title="${p.desc}" aria-label="炼制${p.name}，耗灵材 ${p.cost} 枚：${pillStats(p, state).join('，')}">
        <span class="pill-name">${p.name}</span>
        <span class="pill-effect">${pillStats(p, state).map((t) => `<span>${t}</span>`).join('')}</span>
        <span class="pill-cost">${p.cost}</span>
      </button>`).join('');
  }
  for (const btn of rows.children) {
    const ok = canBrew(state, btn.dataset.pill);
    btn.disabled = !ok;
    btn.classList.toggle('ready', ok);
  }
}

// ===== 秘境 =====
//
// 走 pillStats / stanceStats 的同一套写法：标注由 secretLayer 的公式现算，不另存一份
// 展示文案，改了数值忘了改文案的事在这里不会发生。
//
// 这四项就是「再深一层」那个决定的全部依据，必须印在按钮上而不是藏进 title：
// 手机上没有 hover，藏起来等于没说。险境那一栏把折寿比例一并给出——它才是分水岭。
function layerStats(n) {
  const spec = secretLayer(n);
  if (!spec) return [];
  const pct = (v) => `${Math.round(v * 100)}%`;
  return [
    `灵材 +${spec.lingcai}`,
    `神通 ${pct(spec.shentongChance)}`,
    `功法 ${pct(spec.gongfaChance)}`,
    `险 ${pct(spec.riskChance)}·寿−${pct(spec.lifeCostRatio)}`,
  ];
}

// 未落袋的收获，一行说清。这行字是整个玩法的赌注显示器：撞上险境它全归零，
// 所以哪怕只有灵材一项也要一直摆在眼前。
function haulLine(haul) {
  const parts = [`灵材 ${haul.lingcai} 枚`];
  if (haul.shentongIds.length > 0) parts.push(`神通残篇 ${haul.shentongIds.length} 卷`);
  if (haul.gongfaId) {
    const art = GONGFA[haul.gongfaId];
    parts.push(art ? `《${art.name}》残卷` : '功法残卷');
  }
  return parts.join('　');
}

// 标注只在内容真的变了才重设，判据是一枚指纹。与 renderPills / renderStances 同一条
// 理由：每帧重设 innerHTML 会让手指按住时的高亮被反复打断。按钮节点本身在模板里，
// 从不重建，所以点击也绝不会落在被替换掉的节点上。
function setStats(el, parts) {
  const stamp = parts.join('|');
  if (el.dataset.stamp === stamp) return;
  el.dataset.stamp = stamp;
  el.innerHTML = parts.map((t) => `<span>${t}</span>`).join('');
}

function renderSecret(state) {
  const panel = $('secret-panel');
  const unlocked = state.realm >= SECRET_UNLOCK_REALM;
  panel.hidden = !unlocked;
  if (!unlocked) return;

  const e = state.expedition;
  $('secret-enter-box').hidden = !!e;
  $('secret-going').hidden = !e;

  if (!e) {
    // 入口只报第一层的账。整趟能拿多少不该在这里预告——那正是玩家进去以后
    // 一层一层自己发现的东西，提前摊开就把七个决定压缩回一个了。
    const btn = $('secret-enter');
    const ok = canExplore(state);
    btn.disabled = !ok;
    btn.classList.toggle('ready', ok);
    setStats($('secret-enter-stats'), layerStats(1));
    // 每层耗时必须给绝对年数（而不是「0.4 个小层」）：玩家心里的账是寿元，
    // 而寿元的单位是载。这个数随境界缩放，元婴初期每层 26 载，渡劫初期每层 637 载。
    $('secret-enter-note').textContent = `每深一层约 ${Math.round(layerYears(state))} 载，`
      + `至深 ${SECRET_MAX_LAYER} 层。层层皆可出关，出关方能落袋`;
    return;
  }

  const awaiting = !!e.awaiting;
  const done = e.total > 0 ? Math.max(0, Math.min(1, 1 - e.remaining / e.total)) : 1;
  // 取整规则是「四舍五入，但地板夹到 1」：单用 ceil，踏进一层那一刻会报 27 载而
  // note 里写着 26 载，玩家会以为自己被多收了一年；单用 round，最后半年会显示
  // 「还需 0 载」却还没探完——那是最不能忍的那种骗人。
  $('secret-status').innerHTML = awaiting
    ? `第 <b>${e.layer}</b> 层已探遍，去留由你`
    : `正探第 <b>${e.layer}</b> 层，还需 <b>${Math.max(1, Math.round(e.remaining))}</b> 载`;
  $('secret-fill').style.width = `${(awaiting ? 1 : done) * 100}%`;
  $('secret-haul').innerHTML = `<span class="haul-label">未落袋</span>${haulLine(e.haul)}`;

  // 白描只在等待决定时显示：它是探完一层的犒赏，也是这个决定的气氛。
  // 往下钻的路上摆着上一层的见闻，读起来像是在说眼前的事，反而混淆。
  const text = awaiting ? (e.texts[e.texts.length - 1] ?? '') : '';
  $('secret-text').textContent = text;
  $('secret-text').hidden = text === '';

  $('secret-decide').hidden = !awaiting;
  $('secret-note').textContent = awaiting
    ? '你退在洞口歇息：修炼如常，灵材照常入囊。不催不逼，想好了再定'
    : '身在险地，无暇打坐：修炼 ×0.4，灵材亦不入囊中';

  if (!awaiting) return;

  const deeper = $('secret-deeper');
  const more = canDescend(state);
  deeper.disabled = !more;
  deeper.classList.toggle('ready', more);
  // 名字一栏必须短到不撑破那 7.2em 的列：带上「（第 5 层）」实测会溢出去压在标注上
  // （.secret-name 是 nowrap，溢出不换行只重叠）。下一层是几层，上面那句
  // 「第 4 层已探遍」已经说了，不必在按钮上再说一遍。
  $('secret-deeper-name').textContent = more ? '再深一层' : '已至最深处';
  setStats($('secret-deeper-stats'), more ? layerStats(e.layer + 1) : ['无路可下，唯有出关']);

  const leave = $('secret-leave');
  leave.disabled = false;
  leave.classList.add('ready');
  setStats($('secret-leave-stats'), [`落袋 ${haulLine(e.haul)}`]);
}

// ===== 神通的效果标注 =====
//
// 神通是一局里慢慢攒起来的，能攒到十几条；照天赋那样一条配一整行 desc，侧栏会被撑成
// 几屏高，手机上尤其糟。所以走 stanceStats 的压缩写法：一条一行，名字 + 极简数值。
//
// 字段与标签的对应只有这一张表，单条标注与面板合计共用它，不会各写各的。
// 「寿」是寿元上限，与心法条上表示消耗速度的「寿耗×」是两回事，别混。
const SHENTONG_STAT_LABELS = [
  ['rateAdd', '速'],
  ['breakAdd', '破'],
  ['lifeAdd', '寿'],
  ['intervalAdd', '隔'], // 事件间隔，负数表示来得更勤
  ['fortuneAdd', '缘'],  // 机缘收益与劫难损失，双刃
];

// 心法条用的是同一个 U+2212 减号，比 ASCII 连字符在正文里对得齐
function signedPct(v) {
  return `${v > 0 ? '+' : '−'}${Math.round(Math.abs(v) * 100)}%`;
}

// 六条行为钩子改的是规则而非数值，声明式字段表达不了，只能在这里各给一句四字概括。
// 龟息功是唯一的例外：它的效果本身就是个倍数（ageRate 里硬编码的 0.75），
// 给数字远比给成语有用，用词与心法条上的「寿耗×」保持一致。
const SHENTONG_HOOK_LABEL = {
  guiyuan:  '败留七成',
  guixi:    '寿耗×0.75',
  neishi:   '明察胜算',
  guanxing: '预知休咎',
  wulei:    '劫损减半',
  mingxin:  '道基不损',
};

// 返回可直接逐个塞进 <span> 的标注片段（与 stanceStats 同形），
// 分片是为了让换行只发生在片段之间，「速+12%」自己不会被拦腰截断。
function shentongStats(s) {
  if (!s) return [];
  const parts = [];
  for (const [field, label] of SHENTONG_STAT_LABELS) {
    const v = s[field] ?? 0;
    if (v !== 0) parts.push(`${label}${signedPct(v)}`);
  }
  if (parts.length === 0 && SHENTONG_HOOK_LABEL[s.id]) parts.push(SHENTONG_HOOK_LABEL[s.id]);
  return parts;
}

// 面板标题旁的合计。攒到十几条之后，一条条心算「我到底快了多少」是不现实的。
// 只算神通自己的贡献，不混功法 / 天赋 / 心法——否则这行会变成第二个总面板，
// 反而说不清眼前这堆神通值不值。
function shentongTotals(state) {
  const list = stateShentong(state);
  const parts = [];
  for (const [field, label] of SHENTONG_STAT_LABELS) {
    const sum = list.reduce((a, s) => a + (s[field] ?? 0), 0);
    if (Math.abs(sum) > 1e-9) parts.push(`${label}${signedPct(sum)}`);
  }
  // 龟息功不走声明式字段，但它是全表最能改变体感的一条，合计里不能漏
  if (hasShentong(state, 'guixi')) parts.push('寿耗×0.75');
  return parts;
}

// 观星术：只透露下一桩的吉凶，不透露何时降临。间隔本来就被 intervalModifier 搅得
// 不定，把倒计时一并印出去，等于顺手削掉了「不知何时」这半边张力。
// 没有这门神通时一个字都不显示——信息本身就是奖励，和神识内视显示真实突破率同一套语汇。
function renderOmen(state) {
  const el = $('omen');
  if (!hasShentong(state, 'guanxing')) { el.innerHTML = ''; return; }
  const next = findEvent(state.nextEventId ?? null);
  if (!next) { el.innerHTML = '<span class="omen-label">下一桩</span>天机未明'; return; }
  const fortune = next.type === 'fortune';
  el.innerHTML = `<span class="omen-label">下一桩</span>`
    + `<span class="${fortune ? 'omen-fortune' : 'omen-tribulation'}">${fortune ? '机缘' : '劫难'}</span>`;
}

// render 每帧都跑，所以按钮只建一次，之后仅切换 active。
// 若每帧重设 innerHTML，手指按住时的高亮会被反复打断，点击也可能落在被替换掉的节点上。
function renderStances(state) {
  const bar = $('stance-bar');
  const list = Object.values(STANCES);
  if (bar.childElementCount !== list.length) {
    // aria-label 是必须显式给的：只写 title 的话，读屏念出来的是那句 desc，
    // 心法叫什么反而丢了（实测无障碍树里按钮名就是 desc）。title 仍留着做桌面端悬浮提示。
    bar.innerHTML = list.map((s) => `<button type="button" class="stance-btn" data-stance="${s.id}"
        title="${s.desc}" aria-label="${s.name}：${stanceStats(s).join('，')}">
        <span class="stance-name">${s.name}</span>
        <span class="stance-stats">${stanceStats(s).map((t) => `<span>${t}</span>`).join('')}</span>
      </button>`).join('');
  }
  const current = findStance(state.stanceId);
  for (const btn of bar.children) {
    const on = btn.dataset.stance === current.id;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', String(on));
  }
  $('stance-desc').textContent = `${current.name}——${current.desc}`;
}

// ===== 长按运功 =====
//
// 按住的这段时间是全游戏唯一的实时反馈时刻，玩家必须当场看见自己在冲。所以反馈一次
// 给足四处，且全部由 state.boosting 一处驱动（render 每帧跑，按下与松手自动同步，
// 不需要在事件处理器里另手动改一遍 DOM）：
//   · 按钮进入激活态（金线 + 辉光 + 微微下沉，像真被按住）
//   · 灵气环从 12 秒一圈拉到 0.8 秒一圈，肉眼看得见气在转
//   · 打坐者的呼吸从 4 秒一息急到 0.9 秒一息
//   · 速率数字亮起来（数值本身 ×3 自动跳变，这里只是让那次跳变有个由头）
//   · 寿元条同时开始「烧」——四倍的代价必须和三倍的收益一样显眼，不能只报喜
// 灵气环刻意与 .overflowing（3 秒一圈、金线渐亮）拉开距离：运功是 0.8 秒的急转，
// 两者同时成立时以运功为先——它是此刻正在发生的事，而溢出是一个已经攒下的状态。
function renderBoost(state) {
  const on = !!state.boosting;
  const btn = $('boost-btn');
  setStats($('boost-stats'), boostStats());
  // 读屏必须念得出这是个「按住」的按钮：光有「运功」二字，说不清怎么用、代价多少
  btn.setAttribute('aria-label',
    `运功：按住则修炼 ×${BOOST_RATE_MULT}、寿元消耗 ×${BOOST_AGE_MULT}，松手即停`);
  btn.setAttribute('aria-pressed', String(on));
  // 道消 / 飞升之后按下去不会有任何事（tick 直接返回），按钮就不该还亮着邀请人来按
  btn.disabled = !!(state.dead || state.ascended);
  btn.classList.toggle('boosting', on);
  $('cult-ring').classList.toggle('boosting', on);
  $('life-bar').classList.toggle('burning', on);
}

function render(state) {
  const realm = REALMS[state.realm];
  $('dao-hao').textContent = state.daoHao;
  $('realm-name').textContent = state.ascended ? '已飞升' : `${realm.name} · ${SUB_NAMES[state.sub]}`;

  const cap = lifespanCap(state);
  const capText = Number.isFinite(cap) ? Math.floor(cap) : '∞';
  $('age-text').textContent = `${Math.floor(state.age)} / ${capText} 载`;
  $('luck-text').textContent = `气运 ${state.luck ?? 0}`;
  // 向下取整而非四舍五入：显示 6 枚却炼不动 6 枚的丹，是最不能忍的那种骗人
  const lingcai = Math.floor(state.lingcai ?? 0);
  $('lingcai-text').textContent = `灵材 ${lingcai}`;
  // 寿限被夹到 0 时（极端减寿叠加）除法会得到 Infinity 甚至 NaN，直接给满格：
  // 那一刻本来就是即刻道消
  const lifeRatio = Number.isFinite(cap) ? (cap > 0 ? Math.min(1, state.age / cap) : 1) : 0;
  $('life-fill').style.width = `${lifeRatio * 100}%`;
  $('life-bar').classList.toggle('urgent', lifeRatio > 0.85);

  const need = req(levelIndex(state.realm, state.sub));
  const ratio = Math.min(1, state.cultivation / need);
  const ringFill = $('ring-fill');
  const circumference = 2 * Math.PI * 96;
  ringFill.style.strokeDasharray = String(circumference);
  ringFill.style.strokeDashoffset = String(circumference * (1 - ratio));
  $('ring-aura').classList.toggle('overflowing', state.cultivation > need);
  $('cult-text').textContent = `${formatCult(state.cultivation)} / ${formatCult(need)}`;
  $('rate-text').textContent = `${formatRate(cultivationRate(state))} 修为/载`;

  const overflow = Math.max(0, state.cultivation - need);
  const bonus = overflowBonus(state);
  $('overflow-text').textContent = overflow > 0
    ? `溢出 ${(overflow / need).toFixed(2)} 倍　突破 +${(bonus * 100).toFixed(0)}%${bonus >= 0.30 ? '（已封顶）' : ''}`
    : '';

  const btn = $('breakthrough-btn');
  const ready = canBreakthrough(state);
  btn.disabled = !ready;
  btn.classList.toggle('ready', ready);
  btn.textContent = ready ? `突 破（${chanceLabel(state)}）` : '修为未足';

  renderStances(state);
  renderBoost(state);
  renderPills(state);
  $('pill-lingcai').textContent = String(lingcai);
  renderSecret(state);

  const spirit = findSpirit(state.spiritId);
  $('spirit-panel').innerHTML = `<div class="panel-title">灵根</div>
    <div class="tag tag-${spirit.id}">${(state.elements ?? []).join('')}${spirit.name}</div>
    <div class="panel-desc">${spirit.desc}</div>`;

  $('talent-panel').innerHTML = `<div class="panel-title">天赋</div>` +
    state.talentIds.map((id) => {
      const t = TALENTS.find((x) => x.id === id);
      return t ? `<div class="tag">${t.name}</div><div class="panel-desc">${t.desc}</div>` : '';
    }).join('');

  const g = GONGFA[state.gongfaId];
  $('gongfa-panel').innerHTML = `<div class="panel-title">功法</div>
    <div class="tag tier-${g.tier}">${g.tier}阶 · ${g.name}</div>
    <div class="panel-desc">${g.desc}</div>`;

  // 一条一行：名字做钉子，右侧压紧数值标注；完整 desc 退到 title 里做桌面端补充。
  // 面板标题旁挂合计，省掉玩家自己的心算。
  const totals = shentongTotals(state);
  const totalsHtml = totals.length === 0 ? ''
    : `<span class="st-sum">合计 ${totals.map((t) => `<span>${t}</span>`).join(' ')}</span>`;
  $('shentong-panel').innerHTML = `<div class="panel-title">神通${totalsHtml}</div>` +
    (state.shentongIds.length === 0
      ? '<div class="panel-desc">尚无</div>'
      : state.shentongIds.map((id) => {
          const s = SHENTONG.find((x) => x.id === id);
          if (!s) return '';
          const stats = shentongStats(s).map((t) => `<span>${t}</span>`).join('');
          return `<div class="st-row" title="${s.desc}"><span class="tag st-name">${s.name}</span>`
            + `<span class="st-stats">${stats}</span></div>`;
        }).join(''));

  $('debuff-panel').innerHTML = state.debuffs.length === 0
    ? ''
    : `<div class="panel-title">状态</div>` +
      state.debuffs.map((d) => `<div class="tag danger">${d.name ?? d.id}（余 ${Math.ceil(d.remaining)} 载）</div>`).join('');

  renderOmen(state);
  renderLog(state, $('log-panel'));
}


// ===== main.js =====
let game = null;
let lastFrame = 0;
let endingShown = false;
let speedMultiplier = 1;

function upgradeRows() {
  return Object.keys(UPGRADES).map((key) => {
    const def = UPGRADES[key];
    const lv = game.upgrades[key] ?? 0;
    const maxed = lv >= def.max;
    const cost = maxed ? '—' : upgradeCost(key, lv);
    return `<div class="upgrade-row">
      <span>${def.name} <small>${def.desc}</small></span>
      <span>Lv.${lv}/${def.max}</span>
      <button class="upgrade-btn" data-key="${key}" ${maxed ? 'disabled' : ''}>${cost}</button>
    </div>`;
  }).join('');
}

// 道韵在这里一次性发放，因此转世按钮直接构造新状态，
// 不能调 reincarnate ——那个函数内部会再算一次 daoyunGain，等于双倍发放。
//
// daoyunSettled 标记同样是防重复发放：玩家道消后自动存档会把「已死 + 已加道韵」
// 的状态写进 localStorage，此时刷新页面，loop 会再次看到 dead 并调用本函数。
// 没有这个标记的话，玩家每刷新一次就白拿一次道韵。
function showEnding() {
  endingShown = true;
  // 道消 / 飞升，手自然就松了。这一刻停加速不为省寿元（tick 对死人直接返回，
  // 早已不再推进），而是不让结局弹层背后留着一个又亮着辉光、又被 disabled 压暗的按钮
  stopBoost();
  const gained = daoyunGain(game);
  if (!game.daoyunSettled) {
    game.daoyun = (game.daoyun ?? 0) + gained;
    game.daoyunSettled = true;
  }

  const ascended = game.ascended;
  const summary = ascended ? '证道飞升' : `止步 ${REALMS[game.realm].name}`;

  openModal({
    title: ascended ? '白日飞升' : '道消身殒',
    body: `<p class="event-text">${ascended
      ? '天门洞开，紫气三万里。你回望人间一眼，终究没有再留。'
      : '灯枯油尽，神魂散于天地之间。世上再无你这一号人物。'}</p>
      <p class="event-text">第 ${game.lifetimeCount} 世 · ${summary} · 享年 ${Math.floor(game.age)} 载 · 历机缘劫难 ${game.eventsSeen} 次</p>
      <p class="event-text">此世凝得道韵 <b>${gained}</b> 点，可用 <b id="daoyun-left">${game.daoyun}</b> 点。</p>
      <div id="upgrade-box">${upgradeRows()}</div>`,
    actions: [{ label: '转世重修', onClick: () => {
      clearSave();
      game = createState(Math.random, {
        daoyun: game.daoyun,
        upgrades: { ...game.upgrades },
        lifetimeCount: (game.lifetimeCount ?? 1) + 1,
      });
      endingShown = false;
      pushLog(game, `第 ${game.lifetimeCount} 世。前尘尽忘，唯余一缕道韵萦绕神魂。`);
      saveGame(game);
      render(game);
    } }],
  });

  // 结算面板里当场花道韵，买完重绘保持数字同步
  const box = document.getElementById('upgrade-box');
  box.addEventListener('click', (e) => {
    const btn = e.target.closest('.upgrade-btn');
    if (!btn) return;
    if (!buyUpgrade(game, btn.dataset.key)) return;
    box.innerHTML = upgradeRows();
    document.getElementById('daoyun-left').textContent = String(game.daoyun);
  });
}

function onBreakthrough() {
  if (!canBreakthrough(game)) return;
  const before = REALMS[game.realm].name;
  const result = attemptBreakthrough(game);
  if (result.success) {
    if (game.ascended) pushLog(game, '天门洞开，万道垂青。你一步踏出，自此不在五行中。');
    else pushLog(game, `${before}圆满，天雷加身而不溃。你已入${REALMS[game.realm].name}之境。`);
  } else {
    const hurt = game.debuffs.some((d) => d.id === 'daoji');
    pushLog(game, `冲击${before}壁障失败，真气倒流${hurt ? '，道基受损' : '，幸而道心未损'}，平白折去 ${Math.round(result.lifeCost)} 载阳寿。`);
    if (result.died) pushLog(game, '你终究没能撑过这一劫。');
  }
  render(game);
}

// 心法随时可切，无冷却无消耗——机会成本（同时只能行一门）本身就是那个抉择，
// 再加冷却只会变成一个催人盯着的计时器。
// 事件委托挂在容器上而不是按钮上：renderStances 可能整体重建按钮。
function onStanceClick(e) {
  const btn = e.target.closest('.stance-btn');
  if (!btn) return;
  if (game.dead || game.ascended) return;
  const next = findStance(btn.dataset.stance);
  // 与 findStance 的结果比对而非裸比 stanceId：老存档没有这个字段，
  // 此时界面高亮的是平心静气，再点它就该是空操作，不该刷一条「你改行平心静气」
  if (next.id === findStance(game.stanceId).id) return;
  game.stanceId = next.id;
  pushLog(game, `你改行${next.name}，气机骤然一转。`);
  saveGame(game);
  render(game);
}

// ===== 长按运功 =====
//
// 冲刺是个动作，不是一个模式：按住则修炼 ×3、寿元 ×4（与心法相乘，不是替代），松手即停。
// 它自带节流——手按不了太久，而寿元正以四倍在烧——所以刻意不加冷却、不加资源条。
//
// 这套输入的全部难点在「一定要能松开」。漏掉任何一条出口，玩家就会在离开时被四倍烧
// 寿元，那是这个功能唯一的严重故障模式。所以出口给足五条，且 startBoost / stopBoost
// 都是幂等的，多收几次无害：
//   pointerup / pointercancel   正常抬手；以及被系统手势打断（下拉通知栏、来电、三指切屏）
//   lostpointercapture          捕获被收回（正常抬手后也会到，多一道无害的网）
//   window 的 blur              切到别的窗口 / 标签页，手指再也回不来
//   document 的 visibilitychange 转入后台——手机上锁屏、切 App 走的是这条，blur 未必到
//   window 上再挂一份 pointerup —— 万一 setPointerCapture 没设上，抬手落在了别的元素上
//
// 用 Pointer Events 而非 mousedown/mouseup：一套代码同时管住鼠标、手指与触控笔。
// setPointerCapture 是手机上关键的那一条——手指按住后滑出按钮范围（56px 高的按钮，
// 拇指很容易滑出去），抬起事件仍会回到按钮身上；不设捕获，那次 pointerup 就落在别的
// 元素上，玩家会一直在运功。
function startBoost() {
  if (!game || game.dead || game.ascended) return;
  if (game.boosting) return; // 幂等：keydown 会以系统重复率连续触发
  game.boosting = true;
  // 不等下一帧：按下去的那一刻就该看见环转起来。速率数字随之 ×3 跳变
  render(game);
}

function stopBoost() {
  if (!game || !game.boosting) return;
  game.boosting = false;
  render(game);
}

function setupBoost() {
  const btn = document.getElementById('boost-btn');

  btn.addEventListener('pointerdown', (e) => {
    // 只认主键：鼠标右键长按不该算行功（手指与笔尖的 button 也是 0）
    if (e.button !== 0) return;
    // 捕获这枚指针。并非所有情形都给得成（合成事件的 pointerId 在浏览器眼里并不存在，
    // 会抛 NotFoundError），但捕获失败绝不能连行功都启动不了——退回冒泡路径 +
    // window 上那份兜底同样收得住。
    try { btn.setPointerCapture(e.pointerId); } catch { /* 没捕获到，靠 window 兜底 */ }
    startBoost();
  });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    btn.addEventListener(type, stopBoost);
  }
  window.addEventListener('pointerup', stopBoost);
  window.addEventListener('pointercancel', stopBoost);
  // 长按弹出的系统菜单会当场吃掉后续的 pointerup。CSS 的 -webkit-touch-callout 管 iOS，
  // 这一条管 Android 长按与桌面右键。
  btn.addEventListener('contextmenu', (e) => e.preventDefault());

  // 键盘可达：聚焦后按住空格 / 回车同样行功，松开即停
  btn.addEventListener('keydown', (e) => {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    // 空格默认会滚动页面，且抬起时会合成一次 click——两样都不是我们要的
    e.preventDefault();
    if (e.repeat) return; // 重复触发交给 startBoost 的幂等兜住，这里先省掉一串调用
    startBoost();
  });
  btn.addEventListener('keyup', (e) => {
    if (e.key === ' ' || e.key === 'Enter') stopBoost();
  });
  // 焦点一走就停：键盘玩家按住空格时按 Tab 或点别处，keyup 再也不会到这个按钮身上
  btn.addEventListener('blur', stopBoost);
  window.addEventListener('blur', stopBoost);
  // 转入后台就停。这一条与下面那个存档用的 visibilitychange 是两个监听器，各管一件事；
  // 谁先跑无所谓——serialize 本就把 boosting 归零，存档里不可能留下「正在运功」。
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopBoost(); });
}

// 炼丹。事件委托挂在容器上而不是按钮上：renderPills 会在寿限变动时整体重建按钮。
// 这里不再自己判解锁 / 灵材够不够——brewPill 是唯一的裁判，界面上按钮已被禁用，
// 两处各判一次迟早会判出两个不同的答案。
function onPillClick(e) {
  const btn = e.target.closest('.pill-btn');
  if (!btn) return;
  const r = brewPill(game, btn.dataset.pill);
  if (!r.ok) return;
  pushLog(game, `你取灵材 ${r.pill.cost} 枚投入丹炉，三昧真火起，${r.pill.name}成。就手服下——${r.applied.join('，')}。`);
  saveGame(game);
  render(game);
}

// 入秘境。能不能入只由 startExpedition 一处裁决——界面上按钮已被禁用，
// 两处各判一次迟早会判出两个不同的答案。
function onSecretEnter() {
  const r = startExpedition(game);
  if (!r.ok) return;
  pushLog(game, `你收拾行囊，独身入了那座秘境。第一层约需 ${Math.round(r.total)} 载。`);
  saveGame(game);
  render(game);
}

// 「再深一层」。刻意不做二次确认：这个决定本来就没有时限，玩家可以在洞口坐到天荒地老，
// 真按下去的那一刻他一定是想清楚了的——再弹一个「确定吗」只是不信任他。
function onSecretDeeper() {
  const r = descendLayer(game);
  if (!r.ok) return;
  pushLog(game, `你把灯芯剪短，往第 ${r.layer} 层去了。这一层约需 ${Math.round(r.total)} 载。`);
  saveGame(game);
  render(game);
}

// 「就此出关」。结算落进 state.expeditionResult，由 loop 下一帧统一弹——与险境强制
// 出关（可能发生在离线期间）走同一条出口，两条路上玩家看到的东西才逐字相同。
function onSecretLeave() {
  if (!withdrawExpedition(game)) return;
  saveGame(game);
  render(game);
}

// 出关的一句记事。日志与弹层共用它：即便玩家正好在此刻道消、弹层让位给结局，
// 编年史里也不能缺这一笔（否则寿元凭空少一截而无人交代）。
function expeditionLogLine(r) {
  return `你自秘境出来，${r.applied.join('，')}。`;
}

function showExpeditionReturn() {
  const r = takeExpeditionResult(game);
  if (!r) return;
  pushLog(game, expeditionLogLine(r));
  // 逐层的白描在这里一并回顾。这是离线归来时玩家唯一能读到那些字的地方——
  // 层进度在他关着标签页时也会推进，那几层的见闻不能就这么无声无息地过去。
  const travel = r.texts.length > 0
    ? `<p class="event-text secret-recall">${r.texts.map((t, i) => `${i + 1}　${t}`).join('<br>')}</p>`
    : '';
  openModal({
    title: r.banked ? '秘境出关' : '仓皇而出',
    body: `<p class="event-text">${r.banked
      ? '洞天闭合，风声重归寂静。你抖落一身尘土，回到了旧日打坐的那块青石上。'
      : '你自那片乱石中爬出来时，身上的血已经干了。行囊空空，什么也没带出来。'}</p>
      ${travel}
      <p class="event-text">${r.applied.map((t) => `· ${t}`).join('<br>')}</p>`,
    actions: [{ label: '归座打坐', onClick: () => { saveGame(game); render(game); } }],
  });
}

function showPendingEvent() {
  const event = findEvent(game.pendingEventId);
  if (!event) { game.pendingEventId = null; return; }
  openModal({
    title: event.title,
    body: `<p class="event-text">${event.text}</p>`,
    actions: event.options.map((o) => ({
      label: o.label,
      onClick: (i) => {
        const r = resolveEvent(game, event, i);
        pushLog(game, `【${event.title}】你选择了「${o.label}」。${r.applied.join('，') || '此事就此揭过。'}`);
        if (game.dead) pushLog(game, '你的道途，止步于此。');
        render(game);
      },
    })),
  });
}

function loop(now) {
  requestAnimationFrame(loop);
  if (!lastFrame) lastFrame = now;
  const dt = Math.min(1, (now - lastFrame) / 1000);
  lastFrame = now;

  const prevLevel = game.realm * 4 + game.sub;
  // 探完一层的那一瞬间要记一笔。判据只能是「上一帧还在探、这一帧停在等待决定」——
  // 层号本身不够：撞上险境是强制出关（expedition 直接变 null），那条路由弹层负责。
  const wasDescending = !!game.expedition && !game.expedition.awaiting;
  tick(game, dt * speedMultiplier);
  if (game.realm * 4 + game.sub > prevLevel) {
    pushLog(game, `你于青石之上枯坐多载，忽觉丹田一暖，已入${REALMS[game.realm].name}${SUB_NAMES[game.sub]}。`);
  }
  // 离线期间探完的那一层拿不到这一笔（applyOffline 在 boot 里就跑完了，没有帧可比），
  // 那是刻意的：真去补，每次刷新页面都会重记一遍同一层。那几层的白描不会丢——
  // 它们攒在 expedition.texts 里，出关的弹层会逐层回顾一遍（见 showExpeditionReturn）。
  if (wasDescending && game.expedition?.awaiting) {
    pushLog(game, `${game.expedition.texts[game.expedition.texts.length - 1] ?? ''}`
      + `（已探至第 ${game.expedition.layer} 层，未落袋灵材 ${game.expedition.haul.lingcai} 枚）`);
  }
  if ((game.dead || game.ascended) && !endingShown) showEnding();
  // 弹层优先级：死亡/飞升结局 > 秘境结算 > 事件。
  //
  // 死亡必须先于另两者：同一个 tick 步里可能既触发事件、又归来结算、又寿元耗尽
  // （秘境的折寿本身就能致死），此时 pendingEventId 与 expeditionResult 都还留在
  // state 上。若先弹它们，玩家会看到弹窗闪一下又被结局顶掉。死人没有待抉择的事，
  // 也没有心思听归来见闻——但编年史仍要记上那一趟，否则寿元凭空少一截而无人交代。
  //
  // 秘境先于事件，只因为它是「已经发生完了」的事，而事件是「正等你决定」的事：
  // 先把既成事实收掉，再让玩家面对选择。两者都靠 !isModalOpen() 排队，
  // 谁也不会把谁顶掉（离线归来时，闭关摘要还会排在最前面）。
  if (game.dead || game.ascended) {
    game.pendingEventId = null;
    const last = takeExpeditionResult(game);
    if (last) pushLog(game, expeditionLogLine(last));
  } else if (game.expeditionResult && !isModalOpen()) showExpeditionReturn();
  else if (game.pendingEventId && !isModalOpen()) showPendingEvent();
  render(game);
  renderDebugStats();
}

const SAVE_INTERVAL_MS = 5000;

function showOfflineSummary(offline) {
  if (offline.years < 1) return;
  const truncNote = offline.truncated
    ? '<p class="event-text">你自觉寿元将尽，未敢再入定，遂出关。</p>'
    : '';
  openModal({
    title: '闭关归来',
    body: `<p class="event-text">你自定中醒转，恍如隔世。此番闭关，历时 <b>${Math.floor(offline.years)}</b> 载，
      修为增益 <b>${Math.floor(offline.cultivationGained)}</b>${offline.levelsGained > 0 ? `，境界精进 <b>${offline.levelsGained}</b> 重` : ''}。</p>${truncNote}`,
    actions: [{ label: '继续修行', onClick: () => {} }],
  });
}

// 调试面板随生产构建一同发布：这游戏一轮裸奔要跑三个多小时，
// 没有倍速和状态直改，数值平衡根本没法复核。默认 hidden，按 ~ 才现身。
function setupDebugPanel() {
  const panel = document.getElementById('debug-panel');
  document.addEventListener('keydown', (e) => {
    if (e.key === '`' || e.key === '~') panel.hidden = !panel.hidden;
  });
  document.getElementById('debug-speed').addEventListener('input', (e) => {
    speedMultiplier = Math.max(1, Number(e.target.value) || 1);
  });
  document.getElementById('debug-fill').addEventListener('click', () => {
    game.cultivation = req(levelIndex(game.realm, game.sub));
    render(game);
  });
  // 走与倒计时归零时同一条路：消费掉预抽的那一签，再补下一签。
  // 若这里另起一次现抽，观星术的预告就会与调试触发出来的事件对不上，
  // 调试面板反而成了验不了真的工具。
  document.getElementById('debug-event').addEventListener('click', () => {
    game.pendingEventId = takeNextEvent(game);
  });
  document.getElementById('debug-realm').addEventListener('click', () => {
    if (game.realm < 8) { game.realm += 1; game.sub = 0; game.cultivation = 0; render(game); }
  });
  document.getElementById('debug-age').addEventListener('click', () => {
    game.age = lifespanCap(game) * 0.8;
    render(game);
  });
  document.getElementById('debug-reset').addEventListener('click', () => {
    // 必须先关弹层再换 game。modal 模块的 currentClose 是模块级单例，清档时若有
    // 事件/结局弹层挂着，它不会自己消失：isModalOpen() 会一直为真，loop 里
    // 「pendingEventId && !isModalOpen()」就再也进不去，新角色抽到的事件只会
    // 静静躺在 state 里把 tick 冻住，界面上却没有任何弹层可点。更糟的是那个
    // 残留弹层的选项闭包捕获的是上一世的 event，点下去会把上一世的机缘结算到
    // 新角色头上（实测：新号 recentEventIds 里出现了上一世的事件 id）。
    closeModal();
    clearSave();
    game = createState();
    endingShown = false;
    render(game);
  });
}

function renderDebugStats() {
  const panel = document.getElementById('debug-panel');
  if (panel.hidden) return;
  document.getElementById('debug-stats').innerHTML =
    `等级序号 ${levelIndex(game.realm, game.sub)}｜速率 ${cultivationRate(game).toFixed(1)}` +
    `｜突破率 ${(breakthroughChance(game) * 100).toFixed(1)}%｜寿限 ${Math.floor(lifespanCap(game))}` +
    `｜下次事件 ${game.nextEventIn.toFixed(1)}`;
}

function boot() {
  const loaded = loadGame();
  if (loaded) {
    game = loaded.state;
    render(game);
    showOfflineSummary(loaded.offline);
  } else {
    game = createState();
    pushLog(game, '你自幼被弃于山门之外，十六岁那年，终得引气入体。');
  }

  document.getElementById('breakthrough-btn').addEventListener('click', onBreakthrough);
  document.getElementById('stance-bar').addEventListener('click', onStanceClick);
  document.getElementById('pill-rows').addEventListener('click', onPillClick);
  // 三个按钮都在模板里，renderSecret 从不重建它们，所以监听直接挂在按钮上，
  // 不必像心法 / 丹房那样走容器委托
  document.getElementById('secret-enter').addEventListener('click', onSecretEnter);
  document.getElementById('secret-deeper').addEventListener('click', onSecretDeeper);
  document.getElementById('secret-leave').addEventListener('click', onSecretLeave);
  // 刻意排在下面那个存档用的 visibilitychange 之前：同一事件按注册顺序派发，
  // 先停加速再存档，读起来才是「先松手，再落笔」
  setupBoost();
  setupDebugPanel();
  setInterval(() => saveGame(game), SAVE_INTERVAL_MS);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(game); });
  window.addEventListener('beforeunload', () => saveGame(game));

  render(game);
  requestAnimationFrame(loop);
}

if (typeof document !== 'undefined') boot();

</script>
</body>
</html>
